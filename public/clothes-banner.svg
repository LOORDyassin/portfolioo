<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fff7f0"/>
      <stop offset="50%" style="stop-color:#fef3e8"/>
      <stop offset="100%" style="stop-color:#fce7d0"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#16213e"/>
    </linearGradient>
    <linearGradient id="btnGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f97316"/>
      <stop offset="100%" style="stop-color:#ef4444"/>
    </linearGradient>
    <linearGradient id="tagGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f97316"/>
      <stop offset="100%" style="stop-color:#fb923c"/>
    </linearGradient>
    <filter id="sh">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="rgba(0,0,0,0.14)"/>
    </filter>
    <filter id="sh2">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="rgba(0,0,0,0.08)"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bg2)"/>

  <!-- Dot pattern -->
  <pattern id="dp" x="0" y="0" width="28" height="28" patternUnits="userSpaceOnUse">
    <circle cx="2" cy="2" r="1" fill="rgba(249,115,22,0.07)"/>
  </pattern>
  <rect width="800" height="450" fill="url(#dp)"/>

  <!-- ── LEFT ACCENT BAR ── -->
  <rect x="28" y="28" width="5" height="90" rx="3" fill="#f97316"/>

  <!-- ── TITLE ── -->
  <text x="45" y="62" font-family="'Segoe UI',Arial,sans-serif" font-size="24" font-weight="900" fill="#1a1a2e" letter-spacing="2">DRIPPIN CLOTHING</text>
  <text x="45" y="88" font-family="'Segoe UI',Arial,sans-serif" font-size="16" font-weight="700" fill="#ea580c" letter-spacing="0.5">Fashion E-Commerce Platform · Tunisia</text>

  <!-- ── TAGLINE BOX ── -->
  <rect x="28" y="105" width="240" height="52" rx="8" fill="white" fill-opacity="0.8" filter="url(#sh2)"/>
  <text x="40" y="122" font-family="'Segoe UI',Arial,sans-serif" font-size="9.5" font-weight="700" fill="#f97316">About:</text>
  <text x="40" y="137" font-family="'Segoe UI',Arial,sans-serif" font-size="9" fill="#374151">Full e-commerce store with product catalog, shopping</text>
  <text x="40" y="150" font-family="'Segoe UI',Arial,sans-serif" font-size="9" fill="#374151">cart, wishlist, filters &amp; Netlify deployment.</text>

  <!-- ── PRODUCT CARDS (left mockup) ── -->
  <g filter="url(#sh)">
    <!-- Card 1 -->
    <rect x="28" y="175" width="110" height="150" rx="12" fill="url(#cardGrad)"/>
    <rect x="34" y="181" width="98" height="80" rx="8" fill="#2d2d44"/>
    <!-- T-shirt icon -->
    <text x="83" y="233" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="32" fill="#f97316">👕</text>
    <rect x="34" y="267" width="50" height="6" rx="3" fill="rgba(255,255,255,0.2)"/>
    <text x="83" y="280" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="9" fill="white">T-Shirt Premium</text>
    <text x="83" y="295" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="11" font-weight="800" fill="#f97316">59 DT</text>
    <rect x="38" y="305" width="74" height="14" rx="7" fill="url(#btnGrad)"/>
    <text x="75" y="315" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="8" font-weight="700" fill="white">Add to Cart</text>

    <!-- Card 2 -->
    <rect x="148" y="175" width="110" height="150" rx="12" fill="url(#cardGrad)"/>
    <rect x="154" y="181" width="98" height="80" rx="8" fill="#2d2d44"/>
    <text x="203" y="233" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="32" fill="#60a5fa">👟</text>
    <rect x="154" y="267" width="50" height="6" rx="3" fill="rgba(255,255,255,0.2)"/>
    <text x="203" y="280" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="9" fill="white">Sneakers Urban</text>
    <text x="203" y="295" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="11" font-weight="800" fill="#f97316">120 DT</text>
    <rect x="158" y="305" width="74" height="14" rx="7" fill="url(#btnGrad)"/>
    <text x="195" y="315" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="8" font-weight="700" fill="white">Add to Cart</text>

    <!-- Card 3 (offset, beneath) -->
    <rect x="88" y="336" width="110" height="92" rx="12" fill="url(#cardGrad)" opacity="0.85"/>
    <text x="143" y="380" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="24" fill="#a78bfa">🧥</text>
    <text x="143" y="400" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="9" fill="white">Robe Classique</text>
    <text x="143" y="416" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="10" font-weight="800" fill="#f97316">85 DT</text>
  </g>

