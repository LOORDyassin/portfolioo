    <rect x="606" y="258" width="166" height="130" rx="12" fill="white" fill-opacity="0.85"/>
    <text x="689" y="279" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="10" font-weight="800" fill="#1a1a2e">KEY FEATURES</text>
    <rect x="618" y="285" width="142" height="1" fill="rgba(0,0,0,0.07)"/>
    <text x="621" y="300" font-family="'Segoe UI',Arial,sans-serif" font-size="9" fill="#374151">🛒  Shopping Cart &amp; Checkout</text>
    <text x="621" y="315" font-family="'Segoe UI',Arial,sans-serif" font-size="9" fill="#374151">🔍  Product Filter &amp; Search</text>
    <text x="621" y="330" font-family="'Segoe UI',Arial,sans-serif" font-size="9" fill="#374151">❤️  Wishlist System</text>
    <text x="621" y="345" font-family="'Segoe UI',Arial,sans-serif" font-size="9" fill="#374151">📱  Responsive Design</text>
    <text x="621" y="360" font-family="'Segoe UI',Arial,sans-serif" font-size="9" fill="#374151">🏷️  Product Catalog (DT pricing)</text>
    <text x="621" y="375" font-family="'Segoe UI',Arial,sans-serif" font-size="9" fill="#374151">📸  Instagram Integration</text>
  </g>

  <!-- ── BOTTOM BADGES ── -->
