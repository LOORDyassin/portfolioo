    <text x="336" y="296" text-anchor="middle" font-size="18">👕</text>
    <text x="336" y="312" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="6" fill="rgba(255,255,255,0.6)">T-Shirt</text>
    <text x="336" y="323" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="7" font-weight="700" fill="#f97316">59 DT</text>
    <rect x="312" y="328" width="48" height="6" rx="3" fill="url(#btnGrad)"/>

    <rect x="368" y="264" width="52" height="72" rx="6" fill="#1e1e2e"/>
    <text x="394" y="296" text-anchor="middle" font-size="18">👟</text>
    <text x="394" y="312" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="6" fill="rgba(255,255,255,0.6)">Shoes</text>
    <text x="394" y="323" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="7" font-weight="700" fill="#f97316">120 DT</text>
    <rect x="370" y="328" width="48" height="6" rx="3" fill="url(#btnGrad)"/>

    <rect x="426" y="264" width="52" height="72" rx="6" fill="#1e1e2e"/>
    <text x="452" y="296" text-anchor="middle" font-size="18">🧥</text>
    <text x="452" y="312" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="6" fill="rgba(255,255,255,0.6)">Robes</text>
    <text x="452" y="323" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="7" font-weight="700" fill="#f97316">85 DT</text>
    <rect x="428" y="328" width="48" height="6" rx="3" fill="url(#btnGrad)"/>

    <rect x="484" y="264" width="82" height="72" rx="6" fill="#1e1e2e"/>
    <text x="525" y="292" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="7" font-weight="700" fill="rgba(255,255,255,0.7)">🛒 Cart</text>
    <rect x="492" y="298" width="66" height="1" fill="rgba(255,255,255,0.1)"/>
    <text x="525" y="312" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="6" fill="rgba(255,255,255,0.4)">2 items</text>
    <text x="525" y="323" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="8" font-weight="800" fill="#f97316">179 DT</text>
    <rect x="492" y="328" width="66" height="6" rx="3" fill="url(#btnGrad)"/>
    <text x="525" y="333" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="5.5" font-weight="700" fill="white">Checkout</text>
  </g>

