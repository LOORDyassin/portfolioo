    <rect x="300" y="156" width="280" height="12" fill="#1e1e2e"/>
    <circle cx="318" cy="154" r="4" fill="#ef4444" opacity="0.8"/>
    <circle cx="330" cy="154" r="4" fill="#fbbf24" opacity="0.8"/>
    <circle cx="342" cy="154" r="4" fill="#22c55e" opacity="0.8"/>
    <rect x="358" y="148" width="160" height="12" rx="6" fill="rgba(255,255,255,0.08)"/>
    <text x="438" y="158" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="7.5" fill="rgba(255,255,255,0.4)">clothes-in-tunisia.netlify.app</text>
    <!-- Nav bar -->
