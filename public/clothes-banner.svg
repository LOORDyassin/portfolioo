    <text x="327" y="258" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="6" font-weight="700" fill="white">All</text>
    <rect x="346" y="250" width="40" height="10" rx="5" fill="rgba(255,255,255,0.06)"/>
    <text x="366" y="258" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="6" fill="rgba(255,255,255,0.5)">Featured</text>
    <rect x="390" y="250" width="46" height="10" rx="5" fill="rgba(255,255,255,0.06)"/>
    <text x="413" y="258" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="6" fill="rgba(255,255,255,0.5)">Best Seller</text>
