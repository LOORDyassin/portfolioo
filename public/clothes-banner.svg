    <rect x="606" y="140" width="166" height="105" rx="12" fill="white" fill-opacity="0.85"/>
    <text x="689" y="162" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="10" font-weight="800" fill="#1a1a2e">TECH STACK</text>
    <rect x="618" y="170" width="142" height="1" fill="rgba(0,0,0,0.07)"/>
    <!-- HTML -->
    <rect x="618" y="178" width="142" height="18" rx="5" fill="rgba(249,115,22,0.1)"/>
    <text x="628" y="191" font-family="'Segoe UI',Arial,sans-serif" font-size="9" font-weight="700" fill="#ea580c">HTML5</text>
    <rect x="662" y="182" width="85" height="10" rx="5" fill="#f97316" opacity="0.2"/>
    <rect x="662" y="182" width="55" height="10" rx="5" fill="#f97316" opacity="0.7"/>
    <text x="750" y="191" font-family="'Segoe UI',Arial,sans-serif" font-size="8" font-weight="700" fill="#ea580c">62%</text>
    <!-- CSS -->
    <rect x="618" y="200" width="142" height="18" rx="5" fill="rgba(59,130,246,0.1)"/>
    <text x="628" y="213" font-family="'Segoe UI',Arial,sans-serif" font-size="9" font-weight="700" fill="#3b82f6">CSS3</text>
    <rect x="662" y="204" width="85" height="10" rx="5" fill="#3b82f6" opacity="0.2"/>
    <rect x="662" y="204" width="26" height="10" rx="5" fill="#3b82f6" opacity="0.7"/>
    <text x="750" y="213" font-family="'Segoe UI',Arial,sans-serif" font-size="8" font-weight="700" fill="#3b82f6">31%</text>
    <!-- JS -->
    <rect x="618" y="222" width="142" height="18" rx="5" fill="rgba(251,191,36,0.1)"/>
    <text x="628" y="235" font-family="'Segoe UI',Arial,sans-serif" font-size="9" font-weight="700" fill="#d97706">JavaScript</text>
    <rect x="662" y="226" width="85" height="10" rx="5" fill="#fbbf24" opacity="0.2"/>
    <rect x="662" y="226" width="6" height="10" rx="5" fill="#fbbf24" opacity="0.8"/>
    <text x="750" y="235" font-family="'Segoe UI',Arial,sans-serif" font-size="8" font-weight="700" fill="#d97706">6%</text>
  </g>

  <!-- Features list -->
