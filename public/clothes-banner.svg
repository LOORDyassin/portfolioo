  <g filter="url(#sh2)">
    <rect x="300" y="364" width="130" height="34" rx="10" fill="#0f172a"/>
    <rect x="310" y="374" width="14" height="14" rx="3" fill="#00c7b7"/>
    <text x="320" y="384" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="9" font-weight="800" fill="white">N</text>
    <text x="380" y="377" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="8" font-weight="700" fill="white">DEPLOYED ON</text>
    <text x="380" y="390" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="9" font-weight="800" fill="#00c7b7">NETLIFY</text>
