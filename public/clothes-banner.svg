    <text x="55" y="384" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="8" font-weight="700" fill="white">T-Shirts</text>
    <rect x="90" y="370" width="48" height="20" rx="6" fill="url(#tagGrad)" opacity="0.9"/>
    <text x="114" y="384" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="8" font-weight="700" fill="white">Shoes</text>
    <rect x="145" y="370" width="52" height="20" rx="6" fill="url(#tagGrad)" opacity="0.9"/>
    <text x="171" y="384" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="8" font-weight="700" fill="white">Robes</text>
    <rect x="28" y="397" width="72" height="20" rx="6" fill="url(#tagGrad)" opacity="0.9"/>
    <text x="64" y="411" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="8" font-weight="700" fill="white">Underwear</text>
    <rect x="107" y="397" width="90" height="20" rx="6" fill="url(#tagGrad)" opacity="0.9"/>
