    <text x="320" y="183" font-family="'Segoe UI',Arial,sans-serif" font-size="8" font-weight="700" fill="#f97316">DRIPPIN</text>
    <text x="395" y="183" font-family="'Segoe UI',Arial,sans-serif" font-size="7" fill="rgba(255,255,255,0.6)">Home  About  Shop</text>
    <rect x="530" y="173" width="38" height="14" rx="7" fill="url(#btnGrad)"/>
    <text x="549" y="183" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="7" font-weight="700" fill="white">Cart 🛒</text>
