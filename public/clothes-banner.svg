    <text x="516" y="377" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="8" font-weight="700" fill="white">OPEN-SOURCE</text>
    <text x="516" y="390" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="8" fill="#94a3b8">ON GITHUB</text>
