<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#87CEEB"/>
      <stop offset="100%" style="stop-color:#d4a96a"/>
    </linearGradient>
    <linearGradient id="ground" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#c8a882"/>
      <stop offset="100%" style="stop-color:#a0845c"/>
    </linearGradient>
    <linearGradient id="wall1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f5e6c8"/>
      <stop offset="100%" style="stop-color:#e8d4a0"/>
    </linearGradient>
    <linearGradient id="wall2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff"/>
      <stop offset="100%" style="stop-color:#e8e8e8"/>
    </linearGradient>
    <linearGradient id="tabletGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2a2a2a"/>
      <stop offset="100%" style="stop-color:#1a1a1a"/>
    </linearGradient>
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff"/>
      <stop offset="100%" style="stop-color:#f5f5f5"/>
    </linearGradient>
    <linearGradient id="heroGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#8b5e3c;stop-opacity:0.85"/>
      <stop offset="100%" style="stop-color:#5c3d20;stop-opacity:0.9"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="8" dy="12" stdDeviation="16" flood-color="rgba(0,0,0,0.45)"/>
    </filter>
    <filter id="softsh">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="rgba(0,0,0,0.15)"/>
    </filter>
    <clipPath id="screenClip">
      <rect x="98" y="72" width="298" height="370" rx="4"/>
    </clipPath>
  </defs>

  <!-- ═══ BACKGROUND: TUNISIAN MARKET ═══ -->
  <!-- Sky -->
  <rect width="800" height="500" fill="url(#sky)"/>

  <!-- Right wall (white building) -->
  <rect x="400" y="0" width="400" height="480" fill="url(#wall2)"/>
  <!-- Left wall (ochre building) -->
  <rect x="0" y="0" width="420" height="480" fill="url(#wall1)"/>

  <!-- Alley / street perspective -->
  <polygon points="310,0 490,0 600,500 210,500" fill="#c8a882" opacity="0.3"/>

  <!-- Building details left -->
  <rect x="20" y="40" width="180" height="3" fill="#d4b87a" opacity="0.5"/>
  <rect x="20" y="80" width="180" height="3" fill="#d4b87a" opacity="0.5"/>
  <!-- Windows left wall -->
  <rect x="30" y="100" width="50" height="65" rx="25" fill="#87CEEB" opacity="0.6" stroke="#d4b87a" stroke-width="2"/>
  <rect x="110" y="110" width="45" height="58" rx="22" fill="#87CEEB" opacity="0.6" stroke="#d4b87a" stroke-width="2"/>

  <!-- Building details right -->
  <rect x="600" y="40" width="180" height="3" fill="#cccccc" opacity="0.5"/>
  <rect x="600" y="80" width="180" height="3" fill="#cccccc" opacity="0.5"/>
  <!-- Windows right wall -->
  <rect x="610" y="100" width="50" height="65" rx="25" fill="#87CEEB" opacity="0.6" stroke="#cccccc" stroke-width="2"/>
  <rect x="700" y="110" width="45" height="58" rx="22" fill="#87CEEB" opacity="0.6" stroke="#cccccc" stroke-width="2"/>

  <!-- Ground / street -->
  <rect x="0" y="420" width="800" height="80" fill="url(#ground)"/>
  <rect x="0" y="418" width="800" height="4" fill="#b09060" opacity="0.6"/>

  <!-- ─── HANGING FABRIC STALLS (right side) ─── -->
  <!-- Rope/rail right -->
  <line x1="580" y1="0" x2="800" y2="60" stroke="#8b6914" stroke-width="3"/>
  <line x1="580" y1="30" x2="800" y2="90" stroke="#8b6914" stroke-width="2" opacity="0.6"/>

  <!-- Hanging fabrics right side -->
  <rect x="590" y="0" width="32" height="160" rx="4" fill="#e63946" opacity="0.9"/>
  <rect x="590" y="0" width="32" height="160" rx="4" fill="none" stroke="rgba(0,0,0,0.1)" stroke-width="1"/>
  <!-- fabric pattern -->
  <line x1="590" y1="20" x2="622" y2="20" stroke="rgba(255,255,255,0.3)" stroke-width="1.5"/>
  <line x1="590" y1="40" x2="622" y2="40" stroke="rgba(255,255,255,0.3)" stroke-width="1.5"/>
  <line x1="590" y1="60" x2="622" y2="60" stroke="rgba(255,255,255,0.3)" stroke-width="1.5"/>
  <line x1="590" y1="80" x2="622" y2="80" stroke="rgba(255,255,255,0.3)" stroke-width="1.5"/>
  <line x1="604" y1="0" x2="604" y2="160" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>

  <rect x="630" y="10" width="28" height="140" rx="4" fill="#2d6a4f" opacity="0.9"/>
  <line x1="630" y1="30" x2="658" y2="30" stroke="rgba(255,255,255,0.25)" stroke-width="1.5"/>
  <line x1="630" y1="55" x2="658" y2="55" stroke="rgba(255,255,255,0.25)" stroke-width="1.5"/>
  <line x1="630" y1="80" x2="658" y2="80" stroke="rgba(255,255,255,0.25)" stroke-width="1.5"/>
  <line x1="630" y1="105" x2="658" y2="105" stroke="rgba(255,255,255,0.25)" stroke-width="1.5"/>

  <rect x="665" y="5" width="34" height="155" rx="4" fill="#f4a261" opacity="0.9"/>
  <line x1="665" y1="25" x2="699" y2="25" stroke="rgba(139,69,19,0.3)" stroke-width="2"/>
  <line x1="665" y1="50" x2="699" y2="50" stroke="rgba(139,69,19,0.3)" stroke-width="2"/>
  <line x1="665" y1="75" x2="699" y2="75" stroke="rgba(139,69,19,0.3)" stroke-width="2"/>
  <line x1="665" y1="100" x2="699" y2="100" stroke="rgba(139,69,19,0.3)" stroke-width="2"/>
  <line x1="682" y1="5" x2="682" y2="160" stroke="rgba(139,69,19,0.15)" stroke-width="1.5"/>

  <rect x="706" y="15" width="30" height="145" rx="4" fill="#9b2226" opacity="0.85"/>
  <rect x="742" y="8" width="36" height="152" rx="4" fill="#023e8a" opacity="0.85"/>
  <line x1="742" y1="35" x2="778" y2="35" stroke="rgba(255,255,255,0.3)" stroke-width="1.5"/>
  <line x1="742" y1="65" x2="778" y2="65" stroke="rgba(255,255,255,0.3)" stroke-width="1.5"/>
  <line x1="742" y1="95" x2="778" y2="95" stroke="rgba(255,255,255,0.3)" stroke-width="1.5"/>
  <line x1="742" y1="125" x2="778" y2="125" stroke="rgba(255,255,255,0.3)" stroke-width="1.5"/>
  <rect x="780" y="0" width="20" height="130" rx="4" fill="#e9c46a" opacity="0.85"/>

  <!-- ─── HANGING FABRIC STALLS (left side, partial) ─── -->
  <line x1="0" y1="30" x2="220" y2="0" stroke="#8b6914" stroke-width="2.5"/>
  <rect x="0" y="0" width="26" height="120" rx="4" fill="#6a4c93" opacity="0.85"/>
  <rect x="30" y="5" width="30" height="130" rx="4" fill="#e76f51" opacity="0.85"/>
  <line x1="30" y1="30" x2="60" y2="30" stroke="rgba(255,255,255,0.3)" stroke-width="1.5"/>
  <line x1="30" y1="60" x2="60" y2="60" stroke="rgba(255,255,255,0.3)" stroke-width="1.5"/>
  <line x1="30" y1="90" x2="60" y2="90" stroke="rgba(255,255,255,0.3)" stroke-width="1.5"/>
  <rect x="65" y="0" width="28" height="115" rx="4" fill="#2a9d8f" opacity="0.85"/>

  <!-- ─── PEOPLE SILHOUETTES (background) ─── -->
  <!-- Person 1 - man in jellaba (right, background) -->
  <g opacity="0.75" transform="translate(640,260)">
    <ellipse cx="0" cy="-95" rx="18" ry="22" fill="#8b6914"/>
    <rect x="-22" y="-75" width="44" height="100" rx="8" fill="#c8a050"/>
    <rect x="-22" y="-75" width="44" height="100" rx="8" fill="#8b6914" opacity="0.3"/>
    <rect x="-5" y="25" width="10" height="50" rx="4" fill="#6b4f10"/>
    <rect x="-15" y="25" width="10" height="50" rx="4" fill="#7a5c14"/>
    <!-- Traditional stripes -->
    <line x1="-10" y1="-70" x2="-10" y2="20" stroke="rgba(100,60,0,0.3)" stroke-width="2"/>
    <line x1="10" y1="-70" x2="10" y2="20" stroke="rgba(100,60,0,0.3)" stroke-width="2"/>
  </g>

  <!-- Person 2 - woman with hijab (right, foreground) -->
  <g opacity="0.85" transform="translate(710,270)">
    <ellipse cx="0" cy="-90" rx="16" ry="18" fill="#f4a261"/>
    <!-- Hijab -->
    <ellipse cx="0" cy="-95" rx="22" ry="28" fill="#023e8a"/>
    <rect x="-20" y="-68" width="40" height="98" rx="6" fill="#023e8a"/>
    <!-- dress -->
    <rect x="-18" y="-68" width="36" height="98" rx="6" fill="#1d4e8f"/>
    <rect x="-6" y="30" width="10" height="48" rx="4" fill="#0a3070"/>
    <rect x="-16" y="30" width="10" height="48" rx="4" fill="#1d4e8f"/>
  </g>

  <!-- Person 3 - man (further background) -->
  <g opacity="0.5" transform="translate(570,300) scale(0.75)">
    <ellipse cx="0" cy="-90" rx="16" ry="18" fill="#d4a96a"/>
    <rect x="-18" y="-73" width="36" height="90" rx="6" fill="#8b4513"/>
    <rect x="-6" y="17" width="9" height="42" rx="4" fill="#6b3410"/>
    <rect x="-14" y="17" width="9" height="42" rx="4" fill="#7a3d14"/>
  </g>

  <!-- ═══ TABLET DEVICE ═══ -->
  <g filter="url(#shadow)" transform="translate(55, 55) rotate(-4)">
    <!-- Tablet body -->
    <rect x="68" y="40" width="360" height="430" rx="24" fill="url(#tabletGrad)"/>
    <!-- Tablet bezel detail -->
    <rect x="74" y="46" width="348" height="418" rx="20" fill="#222222"/>
    <!-- Home button -->
    <circle cx="248" cy="458" r="12" fill="#333333" stroke="#444444" stroke-width="2"/>
    <circle cx="248" cy="458" r="8" fill="#2a2a2a" stroke="#3a3a3a" stroke-width="1"/>
    <!-- Camera -->
    <circle cx="248" cy="58" r="5" fill="#333333"/>
    <circle cx="248" cy="58" r="3" fill="#1a1a1a"/>

    <!-- ─── SCREEN CONTENT ─── -->
    <rect x="88" y="72" width="320" height="376" rx="6" fill="url(#screenGrad)"/>

    <!-- STATUS BAR -->
    <rect x="88" y="72" width="320" height="20" rx="0" fill="#f5f5f5"/>
    <text x="98" y="86" font-family="'Segoe UI',Arial,sans-serif" font-size="8" fill="#333">●●●●● Verizon ▸</text>
    <text x="232" y="86" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="8" fill="#333">9:31 AM</text>
    <text x="390" y="86" text-anchor="end" font-family="'Segoe UI',Arial,sans-serif" font-size="8" fill="#333">100% ▮</text>

    <!-- NAV BAR -->
    <rect x="88" y="92" width="320" height="28" rx="0" fill="white"/>
    <rect x="88" y="119" width="320" height="1" fill="#e5e5e5"/>
    <text x="100" y="111" font-family="'Segoe UI',Arial,sans-serif" font-size="9" font-weight="700" fill="#333">HOME</text>
    <text x="142" y="111" font-family="'Segoe UI',Arial,sans-serif" font-size="9" fill="#666">ABOUT</text>
    <text x="183" y="111" font-family="'Segoe UI',Arial,sans-serif" font-size="9" fill="#666">RESOURCES</text>
    <text x="243" y="111" font-family="'Segoe UI',Arial,sans-serif" font-size="9" fill="#666">MAKES</text>
    <text x="285" y="111" font-family="'Segoe UI',Arial,sans-serif" font-size="9" fill="#666">CONTACT</text>
    <rect x="100" y="117" width="30" height="2" fill="#8b4513"/>

    <!-- HERO IMAGE AREA -->
    <rect x="88" y="120" width="320" height="130" fill="#c8a050"/>
    <!-- Moroccan/Tunisian market texture in hero -->
    <rect x="88" y="120" width="320" height="130" fill="url(#heroGrad)"/>
    <!-- Fabric strips decoration in hero -->
    <rect x="88" y="120" width="28" height="130" fill="#e63946" opacity="0.4"/>
    <rect x="118" y="120" width="22" height="130" fill="#2d6a4f" opacity="0.3"/>
    <rect x="380" y="120" width="28" height="130" fill="#023e8a" opacity="0.4"/>
    <!-- People silhouettes in hero -->
    <ellipse cx="180" cy="195" rx="14" ry="16" fill="rgba(0,0,0,0.5)"/>
    <rect x="168" y="209" width="24" height="38" rx="5" fill="rgba(0,0,0,0.5)"/>
    <ellipse cx="250" cy="200" rx="12" ry="14" fill="rgba(0,0,0,0.45)"/>
    <rect x="240" y="212" width="20" height="35" rx="4" fill="rgba(0,0,0,0.45)"/>
    <!-- Hero title -->
    <text x="248" y="155" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="18" font-weight="900" fill="white" letter-spacing="2">CLOTHES IN TUNISIA</text>
    <rect x="160" y="160" width="176" height="2" fill="rgba(255,255,255,0.5)"/>
    <text x="248" y="178" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="9" fill="rgba(255,255,255,0.85)">Traditional &amp; Modern Tunisian Fashion</text>

    <!-- CONTENT AREA -->
    <rect x="88" y="250" width="320" height="198" fill="white"/>

    <!-- Section Title -->
    <text x="248" y="275" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="14" font-weight="900" fill="#1a1a1a" letter-spacing="1">CLOTHES IN TUNISIA</text>
    <rect x="148" y="280" width="200" height="1.5" fill="#d4a96a"/>

    <!-- Product card 1 -->
    <rect x="96" y="288" width="128" height="148" rx="6" fill="#f9f6f0"/>
    <rect x="96" y="288" width="128" height="88" rx="6" fill="#e8d5b0"/>
    <!-- Traditional outfit illustration (simplified) -->
    <ellipse cx="160" cy="318" rx="22" ry="24" fill="#d4a96a"/>
    <!-- Traditional Tunisian outfit body -->
    <rect x="138" y="336" width="44" height="38" rx="4" fill="#8b4513"/>
    <!-- Decorative patterns -->
    <line x1="150" y1="340" x2="170" y2="340" stroke="#d4a96a" stroke-width="1.5"/>
    <line x1="150" y1="348" x2="170" y2="348" stroke="#d4a96a" stroke-width="1.5"/>
    <line x1="150" y1="356" x2="170" y2="356" stroke="#d4a96a" stroke-width="1.5"/>
    <ellipse cx="160" cy="320" rx="14" ry="16" fill="#c49a6c"/>
    <!-- Headdress -->
    <ellipse cx="160" cy="310" rx="16" ry="10" fill="#8b4513"/>
    <text x="160" y="390" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="8" font-weight="700" fill="#1a1a1a">CLOTHES IN TUNISIA</text>
    <text x="160" y="403" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="7" fill="#666">Traditional tunisian conventional</text>
    <text x="160" y="413" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="7" fill="#666">garme and motly clothee</text>
    <text x="160" y="428" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="9" font-weight="700" fill="#8b4513">View Details →</text>

    <!-- Product card 2 -->
    <rect x="232" y="288" width="168" height="148" rx="6" fill="#f9f6f0"/>
    <rect x="232" y="288" width="168" height="88" rx="6" fill="#d4e8f0"/>
    <!-- Modern outfit illustration -->
    <ellipse cx="316" cy="318" rx="22" ry="24" fill="#f4a261"/>
    <rect x="294" y="336" width="44" height="38" rx="4" fill="#023e8a"/>
    <!-- Modern dress pattern -->
    <line x1="305" y1="340" x2="325" y2="340" stroke="rgba(255,255,255,0.5)" stroke-width="1.5"/>
    <line x1="305" y1="348" x2="325" y2="348" stroke="rgba(255,255,255,0.5)" stroke-width="1.5"/>
    <line x1="305" y1="356" x2="325" y2="356" stroke="rgba(255,255,255,0.5)" stroke-width="1.5"/>
    <ellipse cx="316" cy="320" rx="14" ry="16" fill="#e8946e"/>
    <!-- Hijab -->
    <ellipse cx="316" cy="310" rx="18" ry="12" fill="#023e8a"/>
    <text x="316" y="390" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="8" font-weight="700" fill="#1a1a1a">MODERN TUNISIA</text>
    <text x="316" y="403" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="7" fill="#666">Modern Tunisian garments garmem</text>
    <text x="316" y="413" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="7" fill="#666">Tunisian garments</text>
    <text x="316" y="428" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="9" font-weight="700" fill="#023e8a">View Details →</text>
  </g>

  <!-- ─── HAND holding tablet ─── -->
  <g opacity="0.88">
    <!-- Arm / sleeve -->
    <ellipse cx="240" cy="510" rx="70" ry="35" fill="#d4a882"/>
    <rect x="170" y="470" width="140" height="60" rx="30" fill="#d4a882"/>
    <!-- Thumb -->
    <ellipse cx="178" cy="455" rx="18" ry="28" fill="#c89870" transform="rotate(25,178,455)"/>
    <!-- Fingers (behind tablet) -->
    <ellipse cx="310" cy="470" rx="12" ry="25" fill="#c89870" transform="rotate(-10,310,470)"/>
    <ellipse cx="328" cy="465" rx="11" ry="24" fill="#c89870" transform="rotate(-5,328,465)"/>
    <ellipse cx="345" cy="462" rx="10" ry="22" fill="#c89870" transform="rotate(0,345,462)"/>
  </g>

</svg>
