<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d0d1a"/>
      <stop offset="100%" style="stop-color:#1a0d2e"/>
    </linearGradient>
    <linearGradient id="purple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#7c3aed"/>
      <stop offset="100%" style="stop-color:#a855f7"/>
    </linearGradient>
    <linearGradient id="glowLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#7c3aed;stop-opacity:0"/>
      <stop offset="50%" style="stop-color:#a855f7;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#7c3aed;stop-opacity:0"/>
    </linearGradient>
    <radialGradient id="orb1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#7c3aed;stop-opacity:0.35"/>
      <stop offset="100%" style="stop-color:#7c3aed;stop-opacity:0"/>
    </radialGradient>
    <radialGradient id="orb2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#06b6d4;stop-opacity:0.25"/>
      <stop offset="100%" style="stop-color:#06b6d4;stop-opacity:0"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="bigGlow">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bg)"/>

  <!-- Orbs -->
  <ellipse cx="400" cy="225" rx="200" ry="200" fill="url(#orb1)"/>
  <ellipse cx="620" cy="100" rx="130" ry="130" fill="url(#orb2)"/>
  <ellipse cx="160" cy="360" rx="100" ry="100" fill="url(#orb2)" opacity="0.6"/>

  <!-- Subtle grid -->
  <g opacity="0.05" stroke="#a855f7" stroke-width="0.8">
    <line x1="0" y1="90" x2="800" y2="90"/><line x1="0" y1="180" x2="800" y2="180"/>
    <line x1="0" y1="270" x2="800" y2="270"/><line x1="0" y1="360" x2="800" y2="360"/>
    <line x1="80" y1="0" x2="80" y2="450"/><line x1="160" y1="0" x2="160" y2="450"/>
    <line x1="240" y1="0" x2="240" y2="450"/><line x1="320" y1="0" x2="320" y2="450"/>
    <line x1="400" y1="0" x2="400" y2="450"/><line x1="480" y1="0" x2="480" y2="450"/>
    <line x1="560" y1="0" x2="560" y2="450"/><line x1="640" y1="0" x2="640" y2="450"/>
    <line x1="720" y1="0" x2="720" y2="450"/>
  </g>

  <!-- Pulsing outer ring — animated -->
  <circle cx="400" cy="200" r="90" fill="none" stroke="#7c3aed" stroke-width="1" opacity="0.3">
    <animate attributeName="r" values="90;115;90" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.3;0;0.3" dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="400" cy="200" r="90" fill="none" stroke="#a855f7" stroke-width="1.5" opacity="0.5">
    <animate attributeName="r" values="90;108;90" dur="3s" begin="0.4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.5;0;0.5" dur="3s" begin="0.4s" repeatCount="indefinite"/>
  </circle>

  <!-- Center clock / hourglass icon -->
  <g filter="url(#bigGlow)">
    <!-- Hourglass shape -->
    <polygon points="400,130 440,155 440,185 400,210 360,185 360,155" fill="none" stroke="url(#purple)" stroke-width="2.5" stroke-linejoin="round"/>
    <polygon points="400,210 440,235 440,265 400,290 360,265 360,235" fill="none" stroke="url(#purple)" stroke-width="2.5" stroke-linejoin="round"/>
    <!-- Sand fill top (animated) -->
    <polygon points="400,155 425,165 425,180 400,190 375,180 375,165" fill="#7c3aed" opacity="0.5">
      <animate attributeName="opacity" values="0.5;0.2;0.5" dur="2s" repeatCount="indefinite"/>
    </polygon>
    <!-- Sand fill bottom (animated) -->
    <polygon points="400,265 415,255 415,245 400,240 385,245 385,255" fill="#a855f7" opacity="0.7">
      <animate attributeName="opacity" values="0.7;0.3;0.7" dur="2s" repeatCount="indefinite"/>
    </polygon>
    <!-- Sand drop -->
    <circle cx="400" cy="215" r="3" fill="#c084fc">
      <animate attributeName="cy" values="210;230;210" dur="1.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0;1" dur="1.5s" repeatCount="indefinite"/>
    </circle>
    <!-- Top & bottom bars -->
    <line x1="358" y1="130" x2="442" y2="130" stroke="url(#purple)" stroke-width="3" stroke-linecap="round"/>
    <line x1="358" y1="290" x2="442" y2="290" stroke="url(#purple)" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Divider line -->
  <rect x="240" y="315" width="320" height="2" fill="url(#glowLine)" rx="1"/>

  <!-- Main text -->
  <text x="400" y="352" text-anchor="middle" font-family="Arial Black, sans-serif" font-weight="900" font-size="32" fill="url(#purple)" filter="url(#glow)" letter-spacing="3">
    COMING SOON
    <animate attributeName="opacity" values="1;0.6;1" dur="2.5s" repeatCount="indefinite"/>
  </text>

  <!-- Sub text -->
  <text x="400" y="385" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#94a3b8" letter-spacing="1.5">Wait for me — something big is on its way</text>

  <!-- Dots loader -->
  <g fill="#7c3aed" filter="url(#glow)">
    <circle cx="374" cy="415" r="5">
      <animate attributeName="opacity" values="1;0.2;1" dur="1.2s" begin="0s" repeatCount="indefinite"/>
      <animate attributeName="r" values="5;3;5" dur="1.2s" begin="0s" repeatCount="indefinite"/>
    </circle>
    <circle cx="400" cy="415" r="5">
      <animate attributeName="opacity" values="1;0.2;1" dur="1.2s" begin="0.4s" repeatCount="indefinite"/>
      <animate attributeName="r" values="5;3;5" dur="1.2s" begin="0.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="426" cy="415" r="5">
      <animate attributeName="opacity" values="1;0.2;1" dur="1.2s" begin="0.8s" repeatCount="indefinite"/>
      <animate attributeName="r" values="5;3;5" dur="1.2s" begin="0.8s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Corner brackets -->
  <g stroke="#7c3aed" stroke-width="1.5" fill="none" opacity="0.4">
    <polyline points="20,20 20,48 48,48"/>
    <polyline points="780,20 780,48 752,48"/>
    <polyline points="20,430 20,402 48,402"/>
    <polyline points="780,430 780,402 752,402"/>
  </g>

  <!-- Floating particles -->
  <g fill="#a855f7" opacity="0.5">
    <circle cx="150" cy="120" r="2"><animate attributeName="cy" values="120;110;120" dur="4s" repeatCount="indefinite"/></circle>
    <circle cx="640" cy="150" r="2"><animate attributeName="cy" values="150;140;150" dur="3.5s" repeatCount="indefinite"/></circle>
    <circle cx="200" cy="330" r="1.5"><animate attributeName="cy" values="330;320;330" dur="5s" repeatCount="indefinite"/></circle>
    <circle cx="600" cy="310" r="1.5"><animate attributeName="cy" values="310;300;310" dur="4.5s" repeatCount="indefinite"/></circle>
    <circle cx="100" cy="220" r="1.5"><animate attributeName="cy" values="220;210;220" dur="3.8s" repeatCount="indefinite"/></circle>
    <circle cx="700" cy="260" r="1.5"><animate attributeName="cy" values="260;250;260" dur="4.2s" repeatCount="indefinite"/></circle>
  </g>
</svg>
