<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="purple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#7c3aed"/>
      <stop offset="100%" style="stop-color:#a855f7"/>
    </linearGradient>
    <filter id="bigGlow">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Pulsing outer rings -->
  <circle cx="400" cy="225" r="100" fill="none" stroke="#7c3aed" stroke-width="1" opacity="0.3">
    <animate attributeName="r" values="100;130;100" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.3;0;0.3" dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="400" cy="225" r="100" fill="none" stroke="#a855f7" stroke-width="1.5" opacity="0.5">
    <animate attributeName="r" values="100;120;100" dur="3s" begin="0.4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.5;0;0.5" dur="3s" begin="0.4s" repeatCount="indefinite"/>
  </circle>

  <!-- Hourglass -->
  <g filter="url(#bigGlow)" transform="translate(0, 15)">
    <polygon points="400,145 440,170 440,200 400,225 360,200 360,170" fill="none" stroke="url(#purple)" stroke-width="2.5" stroke-linejoin="round"/>
    <polygon points="400,225 440,250 440,280 400,305 360,280 360,250" fill="none" stroke="url(#purple)" stroke-width="2.5" stroke-linejoin="round"/>
    <polygon points="400,170 425,180 425,195 400,205 375,195 375,180" fill="#7c3aed" opacity="0.5">
      <animate attributeName="opacity" values="0.5;0.2;0.5" dur="2s" repeatCount="indefinite"/>
    </polygon>
    <polygon points="400,280 415,270 415,260 400,255 385,260 385,270" fill="#a855f7" opacity="0.7">
      <animate attributeName="opacity" values="0.7;0.3;0.7" dur="2s" repeatCount="indefinite"/>
    </polygon>
    <circle cx="400" cy="230" r="3" fill="#c084fc">
      <animate attributeName="cy" values="225;245;225" dur="1.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0;1" dur="1.5s" repeatCount="indefinite"/>
    </circle>
    <line x1="358" y1="145" x2="442" y2="145" stroke="url(#purple)" stroke-width="3" stroke-linecap="round"/>
    <line x1="358" y1="305" x2="442" y2="305" stroke="url(#purple)" stroke-width="3" stroke-linecap="round"/>
  </g>
</svg>
