<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 128">
  <defs>
    <!-- Dark charcoal background -->
    <linearGradient id="bg" x1="0" y1="0" x2="100" y2="128" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#2e2d3e"/>
      <stop offset="100%" stop-color="#1e1d2e"/>
    </linearGradient>

    <!-- Purple for L — flat with subtle bevel -->
    <linearGradient id="lCol" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#8b3fd4"/>
      <stop offset="100%" stop-color="#5b1fa8"/>
    </linearGradient>
    <linearGradient id="lShade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#4a1890"/>
    </linearGradient>

    <!-- Brushed gold for Y! -->
    <linearGradient id="yGold" x1="0" y1="0" x2="100" y2="110" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#f0cc5a"/>
      <stop offset="25%"  stop-color="#c8942a"/>
      <stop offset="55%"  stop-color="#e8b830"/>
      <stop offset="80%"  stop-color="#a07020"/>
      <stop offset="100%" stop-color="#c8942a"/>
    </linearGradient>
    <linearGradient id="ySheen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#fff8e0" stop-opacity="0.35"/>
      <stop offset="50%"  stop-color="#f0cc5a" stop-opacity="0"/>
      <stop offset="100%" stop-color="#7a5010" stop-opacity="0.3"/>
    </linearGradient>

    <filter id="shadow">
      <feDropShadow dx="2" dy="3" stdDeviation="3" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="100" height="128" fill="url(#bg)"/>

  <!-- ═══ L — purple flat letter with bevel ═══ -->
  <g filter="url(#shadow)">
    <!-- Main L shape -->
    <path d="M4 6 H26 V78 H50 V96 H4 Z" fill="url(#lShade)"/>
    <!-- Left bevel highlight -->
    <path d="M4 6 H8 V96 H4 Z" fill="#a050f8" opacity="0.7"/>
    <!-- Top bevel highlight -->
    <path d="M4 6 H26 V10 H4 Z" fill="#a050f8" opacity="0.5"/>
    <!-- Bottom-bar top bevel -->
    <path d="M4 78 H50 V82 H4 Z" fill="#9040e8" opacity="0.4"/>
    <!-- Inner corner darker -->
    <path d="M22 78 H26 V82 H22 Z" fill="#3a1070"/>
    <!-- Right edge shadow on vertical bar -->
    <path d="M22 6 H26 V78 H22 Z" fill="#3a1070" opacity="0.6"/>
    <!-- Right edge shadow on horizontal bar -->
    <path d="M46 82 H50 V96 H46 Z" fill="#3a1070" opacity="0.6"/>
  </g>

  <!-- ═══ Y! — brushed metallic gold ═══ -->
  <g filter="url(#shadow)">
    <!-- Left arm of Y -->
    <polygon points="24,6 44,6 54,54 36,54" fill="url(#yGold)"/>
    <!-- Right arm of Y -->
    <polygon points="44,6 78,6 62,54 46,54" fill="url(#yGold)"/>
    <!-- Stem of Y -->
    <rect x="36" y="54" width="26" height="30" fill="url(#yGold)"/>
    <!-- Gap between stem and dot (! gap) -->
    <!-- Exclamation dot -->
    <ellipse cx="49" cy="108" rx="10" ry="11" fill="url(#yGold)"/>

    <!-- Metallic sheen overlay on arms -->
    <polygon points="24,6 44,6 54,54 36,54" fill="url(#ySheen)"/>
    <polygon points="44,6 78,6 62,54 46,54" fill="url(#ySheen)"/>
    <rect x="36" y="54" width="26" height="30" fill="url(#ySheen)"/>
    <ellipse cx="49" cy="108" rx="10" ry="11" fill="url(#ySheen)"/>

    <!-- Bevel highlight — top edge of left arm -->
    <polygon points="24,6 44,6 48,10 28,10" fill="white" opacity="0.2"/>
    <!-- Bevel highlight — top edge of right arm -->
    <polygon points="44,6 78,6 78,10 48,10" fill="white" opacity="0.2"/>
    <!-- Bevel highlight — top of dot -->
    <ellipse cx="46" cy="104" rx="5" ry="3" fill="white" opacity="0.25"/>
  </g>

  <!-- ═══ 4-point sparkle ═══ -->
  <path d="M86 116 L87.5 120 L92 121.5 L87.5 123 L86 127 L84.5 123 L80 121.5 L84.5 120 Z"
        fill="#b0a8c8" opacity="0.6"/>
</svg>
