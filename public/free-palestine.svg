<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <!-- Dramatic sky -->
    <linearGradient id="sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#0e0303"/>
      <stop offset="25%"  stop-color="#3d0808"/>
      <stop offset="55%"  stop-color="#7a1a0a"/>
      <stop offset="80%"  stop-color="#b84010"/>
      <stop offset="100%" stop-color="#5a2a08"/>
    </linearGradient>
    <!-- Golden dome -->
    <radialGradient id="domeGold" cx="38%" cy="25%" r="75%">
      <stop offset="0%"   stop-color="#f0d060"/>
      <stop offset="40%"  stop-color="#c8900c"/>
      <stop offset="100%" stop-color="#7a5000"/>
    </radialGradient>
    <!-- Ground -->
    <linearGradient id="ground" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#4a3010"/>
      <stop offset="100%" stop-color="#1a0e04"/>
    </linearGradient>
    <!-- Fire glow -->
    <radialGradient id="fireGlow" cx="50%" cy="100%" r="100%">
      <stop offset="0%"   stop-color="#ff7700" stop-opacity="0.9"/>
      <stop offset="60%"  stop-color="#cc2200" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#880000" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur4">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
    <filter id="blur8">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
    <filter id="textShadow">
      <feDropShadow dx="3" dy="3" stdDeviation="5" flood-color="rgba(0,0,0,0.95)"/>
    </filter>
    <filter id="textGlow">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="domeGlow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- ══ SKY ══ -->
  <rect width="800" height="450" fill="url(#sky)"/>

  <!-- Large smoke clouds -->
  <ellipse cx="120"  cy="130" rx="170" ry="90"  fill="rgba(35,10,10,0.75)"/>
  <ellipse cx="80"   cy="170" rx="130" ry="70"  fill="rgba(25,8,8,0.65)"/>
  <ellipse cx="200"  cy="90"  rx="110" ry="60"  fill="rgba(40,12,12,0.6)"/>
  <ellipse cx="680"  cy="110" rx="150" ry="85"  fill="rgba(35,10,10,0.75)"/>
  <ellipse cx="730"  cy="155" rx="100" ry="65"  fill="rgba(28,8,8,0.65)"/>
  <ellipse cx="600"  cy="80"  rx="100" ry="55"  fill="rgba(38,10,10,0.55)"/>
  <!-- Center smoke plumes -->
  <ellipse cx="310"  cy="75"  rx="70"  ry="45"  fill="rgba(45,14,14,0.5)"/>
  <ellipse cx="510"  cy="90"  rx="80"  ry="50"  fill="rgba(40,12,12,0.5)"/>

  <!-- ══ BACKGROUND CITY SILHOUETTE ══ -->
  <g fill="rgba(60,20,8,0.55)">
    <!-- Left city blocks -->
    <rect x="0"   y="340" width="38"  height="100"/>
    <rect x="30"  y="318" width="28"  height="122"/>
    <rect x="62"  y="348" width="22"  height="92"/>
    <rect x="90"  y="330" width="26"  height="110"/>
    <rect x="120" y="355" width="20"  height="85"/>
    <rect x="148" y="338" width="24"  height="102"/>
    <!-- Right city blocks -->
    <rect x="640" y="342" width="24"  height="98"/>
    <rect x="668" y="322" width="28"  height="118"/>
    <rect x="700" y="350" width="22"  height="90"/>
    <rect x="726" y="330" width="26"  height="110"/>
    <rect x="756" y="348" width="22"  height="92"/>
    <rect x="778" y="325" width="22"  height="115"/>
  </g>

  <!-- ══ FIRE EXPLOSIONS ══ -->
  <!-- Left fire glow -->
  <ellipse cx="170" cy="395" rx="90"  ry="45" fill="rgba(255,80,0,0.55)" filter="url(#blur8)"/>
  <ellipse cx="165" cy="385" rx="55"  ry="32" fill="rgba(255,120,0,0.65)" filter="url(#blur4)"/>
  <!-- Left fire flames -->
  <path d="M 110 430 Q 128 370 142 395 Q 148 355 168 378 Q 174 348 188 372 Q 200 345 210 385 Q 222 360 230 420"
    fill="rgba(255,110,0,0.75)"/>
  <path d="M 120 430 Q 135 380 148 400 Q 155 368 170 388 Q 180 360 192 382"
    fill="rgba(255,160,0,0.5)"/>

  <!-- Right fire -->
  <ellipse cx="648" cy="375" rx="70"  ry="38" fill="rgba(255,60,0,0.5)" filter="url(#blur8)"/>
  <ellipse cx="652" cy="365" rx="42"  ry="26" fill="rgba(255,100,0,0.6)" filter="url(#blur4)"/>
  <path d="M 610 410 Q 624 362 636 382 Q 642 348 658 368 Q 666 342 678 374 Q 688 352 698 404"
    fill="rgba(255,90,0,0.7)"/>

  <!-- Communication tower left background -->
  <g stroke="rgba(90,35,10,0.7)" stroke-width="2" fill="none">
    <line x1="248" y1="195" x2="248" y2="355"/>
    <line x1="242" y1="238" x2="254" y2="238"/>
    <line x1="240" y1="258" x2="256" y2="258"/>
    <line x1="237" y1="280" x2="259" y2="280"/>
    <line x1="244" y1="300" x2="252" y2="300"/>
  </g>

  <!-- ══ GROUND ══ -->
  <rect x="0" y="375" width="800" height="75" fill="url(#ground)"/>
  <!-- Ground crack/texture lines -->
  <line x1="300" y1="380" x2="500" y2="380" stroke="rgba(0,0,0,0.3)" stroke-width="1"/>
  <line x1="200" y1="400" x2="600" y2="400" stroke="rgba(0,0,0,0.2)" stroke-width="1"/>

  <!-- ══ DOME OF THE ROCK ══ -->
  <!-- Outer platform/esplanade -->
  <rect x="240" y="308" width="320" height="70" rx="3" fill="#c4a878"/>

  <!-- Blue tile cladding on lower walls -->
  <rect x="243" y="338" width="314" height="42" rx="2" fill="#4a7fb5" opacity="0.88"/>
  <!-- Tile grid pattern on blue section -->
  <g stroke="rgba(255,255,255,0.12)" stroke-width="0.8">
    <line x1="243" y1="348" x2="557" y2="348"/>
    <line x1="243" y1="358" x2="557" y2="358"/>
    <line x1="243" y1="368" x2="557" y2="368"/>
    <line x1="278" y1="338" x2="278" y2="380"/>
    <line x1="313" y1="338" x2="313" y2="380"/>
    <line x1="348" y1="338" x2="348" y2="380"/>
    <line x1="383" y1="338" x2="383" y2="380"/>
    <line x1="418" y1="338" x2="418" y2="380"/>
    <line x1="453" y1="338" x2="453" y2="380"/>
    <line x1="488" y1="338" x2="488" y2="380"/>
    <line x1="523" y1="338" x2="523" y2="380"/>
  </g>

  <!-- Stone upper wall -->
  <rect x="260" y="308" width="280" height="33" fill="#d4bc96"/>
  <!-- Arched windows on upper wall -->
  <g fill="rgba(40,18,5,0.45)">
    <path d="M 282 338 L 282 322 Q 289.5 315 297 322 L 297 338 Z"/>
    <path d="M 312 338 L 312 322 Q 319.5 315 327 322 L 327 338 Z"/>
    <path d="M 342 338 L 342 322 Q 349.5 315 357 322 L 357 338 Z"/>
    <path d="M 372 338 L 372 322 Q 379.5 315 387 322 L 387 338 Z"/>
    <path d="M 402 338 L 402 322 Q 409.5 315 417 322 L 417 338 Z"/>
    <path d="M 432 338 L 432 322 Q 439.5 315 447 322 L 447 338 Z"/>
    <path d="M 462 338 L 462 322 Q 469.5 315 477 322 L 477 338 Z"/>
    <path d="M 492 338 L 492 322 Q 499.5 315 507 322 L 507 338 Z"/>
  </g>

  <!-- Octagonal drum body -->
  <polygon points="338,308 462,308 484,278 484,248 462,220 338,220 316,248 316,278"
    fill="#d4bc96"/>
  <!-- Blue tile on octagonal drum -->
  <polygon points="341,305 459,305 480,277 480,251 459,222 341,222 320,251 320,277"
    fill="#4a7fb5" opacity="0.88"/>
  <!-- Drum tile grid -->
  <g stroke="rgba(255,255,255,0.1)" stroke-width="0.7">
    <line x1="320" y1="265" x2="480" y2="265"/>
    <line x1="320" y1="278" x2="480" y2="278"/>
    <line x1="350" y1="222" x2="350" y2="305"/>
    <line x1="380" y1="222" x2="380" y2="305"/>
    <line x1="400" y1="222" x2="400" y2="305"/>
    <line x1="420" y1="222" x2="420" y2="305"/>
    <line x1="450" y1="222" x2="450" y2="305"/>
  </g>
  <!-- Drum arched windows -->
  <g fill="rgba(30,12,3,0.5)">
    <path d="M 348 280 L 348 258 Q 357 249 366 258 L 366 280 Z"/>
    <path d="M 377 280 L 377 258 Q 386 249 395 258 L 395 280 Z"/>
    <path d="M 405 280 L 405 258 Q 414 249 423 258 L 423 280 Z"/>
    <path d="M 434 280 L 434 258 Q 443 249 452 258 L 452 280 Z"/>
  </g>

  <!-- White decorative band on drum top -->
  <rect x="316" y="218" width="168" height="8" rx="2" fill="rgba(255,255,255,0.35)"/>

  <!-- ══ GOLDEN DOME ══ -->
  <!-- Dome shadow/base ellipse -->
  <ellipse cx="400" cy="220" rx="94" ry="16" fill="rgba(100,60,0,0.6)"/>
  <!-- Main dome shape -->
  <path d="M 308 220 Q 308 108 400 72 Q 492 108 492 220 Z" fill="url(#domeGold)" filter="url(#domeGlow)"/>
  <!-- Dome highlight reflection -->
  <path d="M 338 212 Q 355 118 400 80 Q 378 130 368 210 Z" fill="rgba(255,240,180,0.18)"/>
  <path d="M 360 216 Q 368 130 400 80 Q 388 140 382 215 Z" fill="rgba(255,250,200,0.1)"/>
  <!-- Dome bottom ridge/base ring -->
  <ellipse cx="400" cy="220" rx="92" ry="11" fill="#c88c08"/>
  <ellipse cx="400" cy="220" rx="88" ry="9"  fill="#d4a010"/>

  <!-- Finial pole -->
  <line x1="400" y1="72" x2="400" y2="42" stroke="#c8900c" stroke-width="3.5"/>
  <!-- Finial ball -->
  <circle cx="400" cy="40" r="5.5" fill="#e8c840"/>
  <!-- Crescent moon -->
  <path d="M 396 34 Q 412 20 418 28 Q 406 22 400 32 Z" fill="#e8c840"/>
  <path d="M 395 34 Q 395 24 402 22 Q 397 26 396 34 Z" fill="#e8c840" opacity="0.6"/>

  <!-- ══ AMBIENT GLOW AROUND DOME ══ -->
  <ellipse cx="400" cy="150" rx="110" ry="100" fill="rgba(200,140,20,0.07)" filter="url(#blur8)"/>

  <!-- ══ BIRDS (silhouettes) ══ -->
  <g fill="rgba(0,0,0,0.55)">
    <path d="M 636 62 Q 642 56 648 62 Q 642 59 636 62"/>
    <path d="M 650 62 Q 656 56 662 62 Q 656 59 650 62"/>
  </g>
  <g fill="rgba(0,0,0,0.4)" transform="translate(18,-8) scale(0.75)">
    <path d="M 636 62 Q 642 56 648 62 Q 642 59 636 62"/>
    <path d="M 650 62 Q 656 56 662 62 Q 656 59 650 62"/>
  </g>

  <!-- ══ ARABIC TEXT (bold dramatic, top-left like the reference) ══ -->
  <!-- Shadow layer -->
  <text x="34" y="155"
    font-family="'Arial Black','Arial Bold',Arial,sans-serif"
    font-size="62" font-weight="900" fill="rgba(0,0,0,0.9)"
    filter="url(#blur4)">&#x623;&#x64A;&#x646; &#x623;&#x646;&#x62A;&#x645;</text>
  <!-- Main white text -->
  <text x="34" y="155"
    font-family="'Arial Black','Arial Bold',Arial,sans-serif"
    font-size="62" font-weight="900" fill="white"
    filter="url(#textShadow)">&#x623;&#x64A;&#x646; &#x623;&#x646;&#x62A;&#x645;</text>

  <!-- Shadow layer line 2 -->
  <text x="34" y="228"
    font-family="'Arial Black','Arial Bold',Arial,sans-serif"
    font-size="56" font-weight="900" fill="rgba(0,0,0,0.9)"
    filter="url(#blur4)">&#x64A;&#x627; &#x639;&#x631;&#x628; &#x61F;</text>
  <!-- Main white text line 2 -->
  <text x="34" y="228"
    font-family="'Arial Black','Arial Bold',Arial,sans-serif"
    font-size="56" font-weight="900" fill="white"
    filter="url(#textShadow)">&#x64A;&#x627; &#x639;&#x631;&#x628; &#x61F;</text>

  <!-- ══ FREE PALESTINE BOTTOM ══ -->
  <!-- Glow -->
  <text x="400" y="430" text-anchor="middle"
    font-family="'Arial Black',Impact,Arial,sans-serif"
    font-size="38" font-weight="900" fill="white" opacity="0.18"
    filter="url(#blur8)" letter-spacing="4">FREE PALESTINE</text>
  <!-- Solid text -->
  <text x="400" y="430" text-anchor="middle"
    font-family="'Arial Black',Impact,Arial,sans-serif"
    font-size="38" font-weight="900" fill="white"
    filter="url(#textShadow)" letter-spacing="4">FREE PALESTINE</text>

  <!-- ══ PALESTINIAN FLAG STRIPE (bottom border) ══ -->
  <rect x="0" y="435" width="800" height="5"  fill="#1C1C1C" opacity="0.9"/>
  <rect x="0" y="440" width="800" height="5"  fill="#F5F5F5" opacity="0.9"/>
  <rect x="0" y="445" width="800" height="5"  fill="#006B35" opacity="0.9"/>
  <!-- Red triangle on flag stripe -->
  <polygon points="0,435 22,442 0,450" fill="#C8102E" opacity="0.9"/>
</svg>
