    <rect x="14" y="104" width="142" height="24" rx="8" fill="rgba(255,255,255,0.06)" stroke="rgba(249,83,198,0.3)" stroke-width="1"/>
    <text x="24" y="120" font-family="'Segoe UI',Arial,sans-serif" font-size="8" fill="rgba(255,255,255,0.35)">✉ Email address</text>
    <rect x="14" y="133" width="142" height="24" rx="8" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
    <text x="24" y="149" font-family="'Segoe UI',Arial,sans-serif" font-size="8" fill="rgba(255,255,255,0.35)">🔒 Password</text>
    <!-- Login button -->
    <rect x="14" y="164" width="142" height="26" rx="10" fill="url(#accent1)"/>
    <text x="85" y="181" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="10" font-weight="700" fill="white">SIGN IN</text>
    <!-- Day badge -->
    <rect x="128" y="8" width="34" height="18" rx="6" fill="rgba(249,83,198,0.2)"/>
    <text x="145" y="20" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="8" font-weight="700" fill="#f953c6">Day 1</text>
  </g>

  <!-- Login card 2 - Blue/purple theme -->
  <g filter="url(#cardsh)" transform="translate(556, 22)">
    <rect x="0" y="0" width="170" height="200" rx="14" fill="#0d1117"/>
    <rect x="0" y="0" width="170" height="4" rx="14" fill="url(#accent2)"/>
    <circle cx="85" cy="42" r="22" fill="rgba(71,118,230,0.15)" stroke="rgba(142,84,233,0.5)" stroke-width="2"/>
    <text x="85" y="48" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="20">🔐</text>
    <text x="85" y="82" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="11" font-weight="700" fill="white">Login</text>
    <text x="85" y="96" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="8" fill="rgba(255,255,255,0.4)">Access your account</text>
    <rect x="14" y="104" width="142" height="24" rx="8" fill="rgba(71,118,230,0.1)" stroke="rgba(71,118,230,0.35)" stroke-width="1"/>
    <text x="24" y="120" font-family="'Segoe UI',Arial,sans-serif" font-size="8" fill="rgba(255,255,255,0.35)">👤 Username</text>
    <rect x="14" y="133" width="142" height="24" rx="8" fill="rgba(71,118,230,0.1)" stroke="rgba(71,118,230,0.2)" stroke-width="1"/>
    <text x="24" y="149" font-family="'Segoe UI',Arial,sans-serif" font-size="8" fill="rgba(255,255,255,0.35)">🔑 Password</text>
    <rect x="14" y="164" width="142" height="26" rx="10" fill="url(#accent2)"/>
    <text x="85" y="181" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="10" font-weight="700" fill="white">LOGIN →</text>
    <rect x="128" y="8" width="34" height="18" rx="6" fill="rgba(71,118,230,0.2)"/>
    <text x="145" y="20" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="8" font-weight="700" fill="#8e54e9">Day 5</text>
  </g>

  <!-- Login card 3 - Green theme -->
  <g filter="url(#cardsh)" transform="translate(370, 238)">
    <rect x="0" y="0" width="170" height="190" rx="14" fill="#0a1628"/>
    <rect x="0" y="0" width="170" height="4" rx="14" fill="url(#accent3)"/>
    <circle cx="85" cy="38" r="22" fill="rgba(56,239,125,0.1)" stroke="rgba(56,239,125,0.4)" stroke-width="2"/>
    <text x="85" y="44" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="20">🛡️</text>
    <text x="85" y="76" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="11" font-weight="700" fill="white">Secure Login</text>
    <rect x="14" y="88" width="142" height="24" rx="8" fill="rgba(56,239,125,0.07)" stroke="rgba(56,239,125,0.25)" stroke-width="1"/>
    <text x="24" y="104" font-family="'Segoe UI',Arial,sans-serif" font-size="8" fill="rgba(255,255,255,0.35)">✉ Email</text>
    <rect x="14" y="117" width="142" height="24" rx="8" fill="rgba(56,239,125,0.07)" stroke="rgba(56,239,125,0.15)" stroke-width="1"/>
    <text x="24" y="133" font-family="'Segoe UI',Arial,sans-serif" font-size="8" fill="rgba(255,255,255,0.35)">🔒 Password</text>
    <rect x="14" y="149" width="142" height="26" rx="10" fill="url(#accent3)"/>
    <text x="85" y="166" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="10" font-weight="700" fill="#0a1628">ENTER →</text>
    <rect x="128" y="8" width="34" height="18" rx="6" fill="rgba(56,239,125,0.15)"/>
    <text x="145" y="20" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="8" font-weight="700" fill="#38ef7d">Day 10</text>
  </g>

  <!-- Login card 4 - Amber/gold theme -->
  <g filter="url(#cardsh)" transform="translate(556, 238)">
    <rect x="0" y="0" width="170" height="190" rx="14" fill="#1c1505"/>
    <rect x="0" y="0" width="170" height="4" rx="14" fill="url(#accent4)"/>
    <circle cx="85" cy="38" r="22" fill="rgba(255,210,0,0.1)" stroke="rgba(255,210,0,0.4)" stroke-width="2"/>
    <text x="85" y="44" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="20">⚡</text>
    <text x="85" y="76" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="11" font-weight="700" fill="white">Quick Sign In</text>
    <rect x="14" y="88" width="142" height="24" rx="8" fill="rgba(255,210,0,0.07)" stroke="rgba(255,210,0,0.25)" stroke-width="1"/>
    <text x="24" y="104" font-family="'Segoe UI',Arial,sans-serif" font-size="8" fill="rgba(255,255,255,0.35)">✉ Email</text>
    <rect x="14" y="117" width="142" height="24" rx="8" fill="rgba(255,210,0,0.07)" stroke="rgba(255,210,0,0.15)" stroke-width="1"/>
    <text x="24" y="133" font-family="'Segoe UI',Arial,sans-serif" font-size="8" fill="rgba(255,255,255,0.35)">🔒 Password</text>
    <rect x="14" y="149" width="142" height="26" rx="10" fill="url(#accent4)"/>
    <text x="85" y="166" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="10" font-weight="700" fill="#1c1505">SIGN IN ⚡</text>
    <rect x="128" y="8" width="34" height="18" rx="6" fill="rgba(255,210,0,0.15)"/>
    <text x="145" y="20" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="8" font-weight="700" fill="#ffd200">Day 25</text>
  </g>

  <!-- Dots connecting cards -->
  <text x="360" y="130" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="18" fill="rgba(255,255,255,0.1)">···</text>
  <text x="360" y="340" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="18" fill="rgba(255,255,255,0.1)">···</text>
</svg>
