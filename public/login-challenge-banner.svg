<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f0c29"/>
      <stop offset="50%" style="stop-color:#1a1040"/>
      <stop offset="100%" style="stop-color:#24243e"/>
    </linearGradient>
    <linearGradient id="accent1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f953c6"/>
      <stop offset="100%" style="stop-color:#b91d73"/>
    </linearGradient>
    <linearGradient id="accent2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4776e6"/>
      <stop offset="100%" style="stop-color:#8e54e9"/>
    </linearGradient>
    <linearGradient id="accent3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#11998e"/>
      <stop offset="100%" style="stop-color:#38ef7d"/>
    </linearGradient>
    <linearGradient id="accent4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f7971e"/>
      <stop offset="100%" style="stop-color:#ffd200"/>
    </linearGradient>
    <linearGradient id="card1bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#16213e"/>
    </linearGradient>
    <linearGradient id="card2bg" x1="135deg">
      <stop offset="0%" style="stop-color:#0d1b2a"/>
      <stop offset="100%" style="stop-color:#1b2838"/>
    </linearGradient>
    <filter id="glow1">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="sh">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="rgba(0,0,0,0.5)"/>
    </filter>
    <filter id="cardsh">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="rgba(0,0,0,0.6)"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bg)"/>

  <!-- Glowing orbs background -->
  <circle cx="150" cy="100" r="120" fill="#f953c6" opacity="0.06" filter="url(#glow1)"/>
  <circle cx="650" cy="350" r="150" fill="#4776e6" opacity="0.07" filter="url(#glow1)"/>
  <circle cx="400" cy="220" r="100" fill="#8e54e9" opacity="0.05"/>

  <!-- Grid dots -->
  <pattern id="grid" x="0" y="0" width="32" height="32" patternUnits="userSpaceOnUse">
    <circle cx="1" cy="1" r="1" fill="rgba(255,255,255,0.04)"/>
  </pattern>
  <rect width="800" height="450" fill="url(#grid)"/>

  <!-- ── LEFT: TITLE SECTION ── -->
  <!-- Day counter badge -->
  <rect x="30" y="30" width="90" height="90" rx="20" fill="url(#accent1)" filter="url(#sh)"/>
  <text x="75" y="68" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="28" font-weight="900" fill="white">25</text>
  <text x="75" y="88" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="10" font-weight="700" fill="rgba(255,255,255,0.85)">DAYS</text>
  <text x="75" y="108" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="8" fill="rgba(255,255,255,0.7)">CHALLENGE</text>

  <!-- Title -->
  <text x="135" y="65" font-family="'Segoe UI',Arial,sans-serif" font-size="22" font-weight="900" fill="white" letter-spacing="1">LOGIN UI</text>
  <text x="135" y="90" font-family="'Segoe UI',Arial,sans-serif" font-size="22" font-weight="900" fill="white" letter-spacing="1">DESIGN SERIES</text>
  <rect x="135" y="100" width="200" height="2.5" rx="1" fill="url(#accent1)"/>
  <text x="135" y="120" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="rgba(255,255,255,0.5)">by LOORD.Y! — YouTube Educational Series</text>

  <!-- Tech badges -->
  <rect x="135" y="134" width="52" height="22" rx="6" fill="rgba(249,83,198,0.15)" stroke="rgba(249,83,198,0.35)" stroke-width="1"/>
  <text x="161" y="149" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="9" font-weight="700" fill="#f953c6">HTML5</text>
  <rect x="194" y="134" width="48" height="22" rx="6" fill="rgba(71,118,230,0.15)" stroke="rgba(71,118,230,0.35)" stroke-width="1"/>
  <text x="218" y="149" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="9" font-weight="700" fill="#4776e6">CSS3</text>
  <rect x="249" y="134" width="56" height="22" rx="6" fill="rgba(255,210,0,0.12)" stroke="rgba(255,210,0,0.3)" stroke-width="1"/>
  <text x="277" y="149" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="9" font-weight="700" fill="#ffd200">YouTube</text>

  <!-- ── STATS ROW ── -->
  <g transform="translate(30, 175)">
    <rect x="0" y="0" width="88" height="56" rx="10" fill="rgba(249,83,198,0.1)" stroke="rgba(249,83,198,0.2)" stroke-width="1"/>
    <text x="44" y="24" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="22" font-weight="900" fill="#f953c6">25</text>
    <text x="44" y="42" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="8" fill="rgba(255,255,255,0.5)">Days / Designs</text>

    <rect x="96" y="0" width="88" height="56" rx="10" fill="rgba(71,118,230,0.1)" stroke="rgba(71,118,230,0.2)" stroke-width="1"/>
    <text x="140" y="24" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="22" font-weight="900" fill="#4776e6">28</text>
    <text x="140" y="42" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="8" fill="rgba(255,255,255,0.5)">Commits</text>

    <rect x="192" y="0" width="88" height="56" rx="10" fill="rgba(17,153,142,0.1)" stroke="rgba(17,153,142,0.2)" stroke-width="1"/>
    <text x="236" y="24" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="20" font-weight="900" fill="#38ef7d">76%</text>
    <text x="236" y="42" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="8" fill="rgba(255,255,255,0.5)">CSS Heavy</text>
  </g>

  <!-- ── DESCRIPTION ── -->
  <text x="30" y="270" font-family="'Segoe UI',Arial,sans-serif" font-size="10" fill="rgba(255,255,255,0.55)" font-style="italic">"A progressive 25-day challenge building unique</text>
  <text x="30" y="284" font-family="'Segoe UI',Arial,sans-serif" font-size="10" fill="rgba(255,255,255,0.55)" font-style="italic">login page designs with pure HTML &amp; CSS."</text>

  <!-- YouTube badge -->
  <g transform="translate(30, 300)">
    <rect x="0" y="0" width="160" height="36" rx="10" fill="#ff0000" opacity="0.9" filter="url(#sh)"/>
    <polygon points="20,10 20,26 36,18" fill="white"/>
    <text x="90" y="14" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="9" font-weight="700" fill="white">LOORD_YASSINE</text>
    <text x="90" y="27" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="8" fill="rgba(255,255,255,0.85)">YouTube Channel</text>
  </g>

  <!-- GitHub badge -->
  <g transform="translate(200, 300)">
    <rect x="0" y="0" width="140" height="36" rx="10" fill="#0f172a" filter="url(#sh)"/>
    <circle cx="20" cy="18" r="10" fill="white"/>
    <text x="20" y="22" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="11" font-weight="900" fill="#0f172a">G</text>
    <text x="88" y="14" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="8" font-weight="700" fill="white">OPEN SOURCE</text>
    <text x="88" y="27" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="8" fill="#94a3b8">github.com</text>
  </g>

  <!-- ── RIGHT: LOGIN CARD MOCKUPS ── -->

  <!-- Login card 1 - Dark gradient theme -->
  <g filter="url(#cardsh)" transform="translate(370, 22)">
    <rect x="0" y="0" width="170" height="200" rx="14" fill="#1a1a2e"/>
    <rect x="0" y="0" width="170" height="4" rx="14" fill="url(#accent1)"/>
    <!-- Avatar circle -->
    <circle cx="85" cy="42" r="22" fill="rgba(249,83,198,0.15)" stroke="rgba(249,83,198,0.4)" stroke-width="2"/>
    <text x="85" y="48" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="20">👤</text>
    <text x="85" y="82" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="11" font-weight="700" fill="white">Welcome Back</text>
    <text x="85" y="96" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="8" fill="rgba(255,255,255,0.4)">Sign in to continue</text>
