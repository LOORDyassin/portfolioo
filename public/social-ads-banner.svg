<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f0a1e"/>
      <stop offset="50%" stop-color="#1a0a2e"/>
      <stop offset="100%" stop-color="#0a0f1e"/>
    </linearGradient>
    <linearGradient id="igGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f09433"/>
      <stop offset="25%" stop-color="#e6683c"/>
      <stop offset="50%" stop-color="#dc2743"/>
      <stop offset="75%" stop-color="#cc2366"/>
      <stop offset="100%" stop-color="#bc1888"/>
    </linearGradient>
    <linearGradient id="fbGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1877f2"/>
      <stop offset="100%" stop-color="#0d5dbf"/>
    </linearGradient>
    <linearGradient id="ttGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#010101"/>
      <stop offset="100%" stop-color="#1a1a1a"/>
    </linearGradient>
    <linearGradient id="twGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1DA1F2"/>
      <stop offset="100%" stop-color="#0d8dd4"/>
    </linearGradient>
    <linearGradient id="cardGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#db2777"/>
    </linearGradient>
    <linearGradient id="cardGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0891b2"/>
      <stop offset="100%" stop-color="#6d28d9"/>
    </linearGradient>
    <linearGradient id="cardGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="rgba(0,0,0,0.6)"/>
    </filter>
    <filter id="softShadow">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="rgba(0,0,0,0.4)"/>
    </filter>
    <filter id="glow">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#bg)"/>

  <!-- Subtle radial glow center-left -->
  <circle cx="200" cy="250" r="300" fill="rgba(124,58,237,0.07)"/>
  <!-- Right glow -->
  <circle cx="600" cy="250" r="250" fill="rgba(219,39,119,0.06)"/>

  <!-- Grid dots pattern -->
  <pattern id="dots" x="0" y="0" width="32" height="32" patternUnits="userSpaceOnUse">
    <circle cx="1.5" cy="1.5" r="1" fill="rgba(255,255,255,0.04)"/>
  </pattern>
  <rect width="800" height="500" fill="url(#dots)"/>

  <!-- ── LEFT PANEL: Title + info ── -->
  <!-- Accent bar -->
  <rect x="30" y="30" width="4" height="80" rx="2" fill="url(#cardGrad1)"/>

  <!-- Title -->
  <text x="46" y="60" font-family="'Segoe UI',Arial,sans-serif" font-size="20" font-weight="800" fill="white" letter-spacing="0.5">SOCIAL MEDIA</text>
  <text x="46" y="85" font-family="'Segoe UI',Arial,sans-serif" font-size="18" font-weight="800" fill="#a78bfa" letter-spacing="0.5">AD CAMPAIGNS</text>

  <!-- Description box -->
  <rect x="30" y="105" width="230" height="90" rx="10" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <text x="44" y="124" font-family="'Segoe UI',Arial,sans-serif" font-size="9.5" font-weight="600" fill="#a78bfa">What I Do:</text>
  <text x="44" y="140" font-family="'Segoe UI',Arial,sans-serif" font-size="9" fill="rgba(255,255,255,0.7)">• Brand identity creatives</text>
  <text x="44" y="154" font-family="'Segoe UI',Arial,sans-serif" font-size="9" fill="rgba(255,255,255,0.7)">• Platform-optimized ad formats</text>
  <text x="44" y="168" font-family="'Segoe UI',Arial,sans-serif" font-size="9" fill="rgba(255,255,255,0.7)">• Story, reel &amp; feed designs</text>
  <text x="44" y="182" font-family="'Segoe UI',Arial,sans-serif" font-size="9" fill="rgba(255,255,255,0.7)">• Photoshop &amp; Illustrator workflow</text>

  <!-- Tools used -->
  <text x="30" y="215" font-family="'Segoe UI',Arial,sans-serif" font-size="9" font-weight="700" fill="rgba(255,255,255,0.4)" letter-spacing="1">TOOLS USED</text>
  <!-- PS badge -->
  <rect x="30" y="222" width="52" height="22" rx="6" fill="#31A8FF" opacity="0.9"/>
  <text x="56" y="237" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="9" font-weight="800" fill="white">Ps</text>
  <!-- AI badge -->
  <rect x="88" y="222" width="52" height="22" rx="6" fill="#FF9A00" opacity="0.9"/>
  <text x="114" y="237" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="9" font-weight="800" fill="white">Ai</text>
  <!-- Figma badge -->
  <rect x="146" y="222" width="52" height="22" rx="6" fill="rgba(255,255,255,0.12)" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
  <text x="172" y="237" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="9" font-weight="700" fill="white">Figma</text>

  <!-- Social platform icons row (left panel) -->
  <!-- Instagram icon circle -->
  <circle cx="46" cy="285" r="17" fill="url(#igGrad)" filter="url(#softShadow)"/>
  <rect x="38" y="277" width="16" height="16" rx="4" fill="none" stroke="white" stroke-width="1.5"/>
  <circle cx="46" cy="285" r="4" fill="none" stroke="white" stroke-width="1.5"/>
  <circle cx="51.5" cy="279.5" r="1.2" fill="white"/>

  <!-- Facebook icon circle -->
  <circle cx="82" cy="285" r="17" fill="url(#fbGrad)" filter="url(#softShadow)"/>
  <text x="82" y="291" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="900" fill="white">f</text>

  <!-- TikTok icon circle -->
  <circle cx="118" cy="285" r="17" fill="url(#ttGrad)" stroke="rgba(255,255,255,0.15)" stroke-width="1" filter="url(#softShadow)"/>
  <!-- TikTok note shape simplified -->
  <path d="M122 278 C122 278 124 279 126 280 L126 282 C124 281 122 280 122 280 L122 290 C122 292 120 293 118 292 C116 291 115 289 116 287 C117 285 119 285 120 286 L120 280 Z" fill="white"/>
  <!-- TikTok cyan shadow -->
  <path d="M121 278 C121 278 123 279 125 280 L125 282 C123 281 121 280 121 280 L121 290 C121 292 119 293 117 292 C115 291 114 289 115 287 C116 285 118 285 119 286 L119 280 Z" fill="#69C9D0" opacity="0.6"/>

  <!-- Twitter/X icon circle -->
  <circle cx="154" cy="285" r="17" fill="url(#twGrad)" filter="url(#softShadow)"/>
  <text x="154" y="291" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="900" fill="white">𝕏</text>

  <!-- Stats row -->
  <rect x="30" y="315" width="230" height="60" rx="10" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <!-- Stat 1 -->
  <text x="75" y="338" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="18" font-weight="800" fill="#a78bfa">15+</text>
  <text x="75" y="354" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="8" fill="rgba(255,255,255,0.5)">Campaigns</text>
  <!-- Divider -->
  <line x1="140" y1="322" x2="140" y2="368" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  <!-- Stat 2 -->
  <text x="195" y="338" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="18" font-weight="800" fill="#f472b6">4</text>
  <text x="195" y="354" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="8" fill="rgba(255,255,255,0.5)">Platforms</text>

  <!-- ── CENTER COLUMN: 3 Ad mockup cards ── -->
  <!-- Card 1: Instagram Story ad mockup -->
  <g filter="url(#shadow)">
    <rect x="285" y="28" width="140" height="210" rx="14" fill="#1a1028"/>
    <rect x="285" y="28" width="140" height="5" rx="2" fill="url(#cardGrad1)" opacity="0.8"/>
    <!-- Story frame -->
    <rect x="293" y="42" width="124" height="180" rx="8" fill="#0d0920"/>
    <!-- Story gradient bg -->
    <rect x="293" y="42" width="124" height="180" rx="8" fill="url(#cardGrad1)" opacity="0.18"/>
    <!-- Profile row -->
    <circle cx="307" cy="55" r="6" fill="url(#igGrad)"/>
    <text x="316" y="59" font-family="'Segoe UI',Arial,sans-serif" font-size="7" fill="rgba(255,255,255,0.8)">@loord.y19</text>
    <!-- Story image placeholder (product mockup) -->
    <rect x="299" y="68" width="112" height="100" rx="6" fill="rgba(124,58,237,0.3)"/>
    <!-- Product shape -->
    <rect x="318" y="80" width="78" height="50" rx="8" fill="rgba(167,139,250,0.5)"/>
    <text x="357" y="110" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="9" font-weight="700" fill="white">PRODUCT</text>
    <!-- CTA button -->
    <rect x="305" y="178" width="104" height="20" rx="10" fill="url(#igGrad)"/>
    <text x="357" y="192" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="8" font-weight="700" fill="white">Shop Now →</text>
    <!-- Headline text lines -->
    <rect x="303" y="175" width="80" height="7" rx="3" fill="rgba(255,255,255,0.15)"/>
    <rect x="303" y="184" width="60" height="6" rx="3" fill="rgba(255,255,255,0.1)"/>
    <!-- Label -->
    <rect x="298" y="196" width="52" height="14" rx="4" fill="rgba(240,148,51,0.25)" stroke="rgba(240,148,51,0.5)" stroke-width="0.8"/>
    <text x="324" y="206" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="7" font-weight="700" fill="#f09433">STORY AD</text>
  </g>

  <!-- Card 2: Facebook Feed ad mockup -->
  <g filter="url(#shadow)">
    <rect x="442" y="28" width="160" height="210" rx="14" fill="#0a1a2a"/>
    <rect x="442" y="28" width="160" height="5" rx="2" fill="url(#fbGrad)" opacity="0.8"/>
    <!-- Feed card -->
    <rect x="450" y="42" width="144" height="180" rx="8" fill="#0c1828"/>
    <!-- Header -->
    <circle cx="464" cy="55" r="6" fill="url(#fbGrad)"/>
    <text x="473" y="59" font-family="'Segoe UI',Arial,sans-serif" font-size="7" fill="rgba(255,255,255,0.8)">Sponsored</text>
    <!-- Ad image block -->
    <rect x="456" y="68" width="132" height="80" rx="5" fill="rgba(24,119,242,0.25)"/>
    <rect x="470" y="78" width="104" height="60" rx="6" fill="rgba(29,161,242,0.3)"/>
    <!-- Design layers visual -->
    <rect x="475" y="84" width="94" height="46" rx="4" fill="rgba(99,102,241,0.35)"/>
    <text x="522" y="112" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="10" font-weight="800" fill="white">50% OFF</text>
    <text x="522" y="124" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="6" fill="rgba(255,255,255,0.7)">LIMITED TIME OFFER</text>
    <!-- Caption lines -->
    <rect x="456" y="154" width="110" height="7" rx="3" fill="rgba(255,255,255,0.15)"/>
    <rect x="456" y="164" width="85" height="6" rx="3" fill="rgba(255,255,255,0.1)"/>
    <!-- CTA -->
    <rect x="456" y="175" width="80" height="18" rx="5" fill="url(#fbGrad)"/>
    <text x="496" y="187" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="7.5" font-weight="700" fill="white">Learn More</text>
    <!-- Label -->
    <rect x="456" y="196" width="55" height="14" rx="4" fill="rgba(24,119,242,0.25)" stroke="rgba(29,161,242,0.5)" stroke-width="0.8"/>
    <text x="484" y="206" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="7" font-weight="700" fill="#60a5fa">FEED AD</text>
  </g>

  <!-- ── RIGHT COLUMN: 2 stacked cards ── -->
  <!-- Card 3: TikTok Reel mockup -->
  <g filter="url(#shadow)">
    <rect x="620" y="28" width="150" height="190" rx="14" fill="#0a0a10"/>
    <rect x="620" y="28" width="150" height="5" rx="2" fill="url(#ttGrad)" stroke="rgba(105,201,208,0.5)" stroke-width="1" opacity="0.9"/>
    <rect x="628" y="42" width="134" height="158" rx="8" fill="#050508"/>
    <!-- Reel gradient -->
    <rect x="628" y="42" width="134" height="158" rx="8" fill="url(#cardGrad2)" opacity="0.12"/>
    <!-- Vertical format indicator -->
    <text x="695" y="78" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="10" font-weight="800" fill="white">REEL</text>
    <text x="695" y="92" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="8" fill="rgba(255,255,255,0.6)">9:16 Format</text>
    <!-- Play button -->
    <circle cx="695" cy="120" r="18" fill="rgba(255,255,255,0.12)" stroke="rgba(255,255,255,0.25)" stroke-width="1.5"/>
    <polygon points="690,111 690,129 708,120" fill="white" opacity="0.8"/>
    <!-- Side actions (TikTok style) -->
    <circle cx="752" cy="100" r="6" fill="rgba(255,255,255,0.15)"/>
    <text x="752" y="104" text-anchor="middle" font-size="8">♥</text>
    <circle cx="752" cy="118" r="6" fill="rgba(255,255,255,0.15)"/>
    <text x="752" y="122" text-anchor="middle" font-size="7" fill="rgba(255,255,255,0.7)">↗</text>
    <!-- Bottom text -->
    <rect x="632" y="182" width="100" height="6" rx="3" fill="rgba(255,255,255,0.15)"/>
    <rect x="632" y="191" width="75" height="5" rx="3" fill="rgba(255,255,255,0.1)"/>
    <!-- Label -->
    <rect x="632" y="164" width="56" height="14" rx="4" fill="rgba(105,201,208,0.15)" stroke="rgba(105,201,208,0.4)" stroke-width="0.8"/>
    <text x="660" y="174" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="7" font-weight="700" fill="#69C9D0">TIKTOK AD</text>
  </g>

  <!-- Card 4: Twitter/X Banner mockup -->
  <g filter="url(#shadow)">
    <rect x="620" y="232" width="150" height="100" rx="14" fill="#091825"/>
    <rect x="620" y="232" width="150" height="5" rx="2" fill="url(#twGrad)" opacity="0.8"/>
    <rect x="628" y="245" width="134" height="78" rx="8" fill="#060f1a"/>
    <!-- Profile banner style -->
    <rect x="628" y="245" width="134" height="34" rx="8" fill="rgba(29,161,242,0.2)"/>
    <!-- Twitter X icon -->
    <text x="695" y="268" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="900" fill="rgba(255,255,255,0.6)">𝕏</text>
    <!-- Profile row -->
    <circle cx="640" cy="288" r="8" fill="url(#twGrad)"/>
    <rect x="652" y="284" width="70" height="6" rx="3" fill="rgba(255,255,255,0.2)"/>
    <rect x="652" y="293" width="50" height="5" rx="3" fill="rgba(255,255,255,0.12)"/>
    <!-- Label -->
    <rect x="628" y="308" width="52" height="12" rx="4" fill="rgba(29,161,242,0.2)" stroke="rgba(29,161,242,0.4)" stroke-width="0.8"/>
    <text x="654" y="317" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="7" font-weight="700" fill="#1DA1F2">X / TWITTER</text>
  </g>

  <!-- ── BOTTOM STRIP: workflow / metrics ── -->
  <rect x="30" y="395" width="740" height="80" rx="14" fill="rgba(255,255,255,0.035)" stroke="rgba(255,255,255,0.07)" stroke-width="1"/>

  <!-- Workflow steps -->
  <text x="55" y="418" font-family="'Segoe UI',Arial,sans-serif" font-size="8" font-weight="700" fill="rgba(255,255,255,0.35)" letter-spacing="1.5">DESIGN WORKFLOW</text>

  <!-- Step 1 -->
  <circle cx="65" cy="452" r="14" fill="rgba(167,139,250,0.2)" stroke="rgba(167,139,250,0.5)" stroke-width="1.5"/>
  <text x="65" y="456" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="9" font-weight="800" fill="#a78bfa">01</text>
  <text x="65" y="471" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="7.5" fill="rgba(255,255,255,0.55)">Brief</text>

  <line x1="83" y1="452" x2="108" y2="452" stroke="rgba(255,255,255,0.15)" stroke-width="1" stroke-dasharray="3,2"/>

  <!-- Step 2 -->
  <circle cx="122" cy="452" r="14" fill="rgba(244,114,182,0.2)" stroke="rgba(244,114,182,0.5)" stroke-width="1.5"/>
  <text x="122" y="456" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="9" font-weight="800" fill="#f472b6">02</text>
  <text x="122" y="471" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="7.5" fill="rgba(255,255,255,0.55)">Concept</text>

  <line x1="140" y1="452" x2="165" y2="452" stroke="rgba(255,255,255,0.15)" stroke-width="1" stroke-dasharray="3,2"/>

  <!-- Step 3 -->
  <circle cx="179" cy="452" r="14" fill="rgba(96,165,250,0.2)" stroke="rgba(96,165,250,0.5)" stroke-width="1.5"/>
  <text x="179" y="456" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="9" font-weight="800" fill="#60a5fa">03</text>
  <text x="179" y="471" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="7.5" fill="rgba(255,255,255,0.55)">Design</text>

  <line x1="197" y1="452" x2="222" y2="452" stroke="rgba(255,255,255,0.15)" stroke-width="1" stroke-dasharray="3,2"/>

  <!-- Step 4 -->
  <circle cx="236" cy="452" r="14" fill="rgba(52,211,153,0.2)" stroke="rgba(52,211,153,0.5)" stroke-width="1.5"/>
  <text x="236" y="456" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="9" font-weight="800" fill="#34d399">04</text>
  <text x="236" y="471" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="7.5" fill="rgba(255,255,255,0.55)">Export</text>

  <!-- Divider -->
  <line x1="275" y1="405" x2="275" y2="465" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>

  <!-- Platform coverage -->
  <text x="295" y="418" font-family="'Segoe UI',Arial,sans-serif" font-size="8" font-weight="700" fill="rgba(255,255,255,0.35)" letter-spacing="1.5">PLATFORMS COVERED</text>

  <!-- Instagram pill -->
  <rect x="295" y="428" width="80" height="22" rx="11" fill="rgba(240,148,51,0.15)" stroke="rgba(240,148,51,0.4)" stroke-width="1"/>
  <text x="335" y="443" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="8.5" font-weight="700" fill="#f09433">Instagram</text>

  <!-- Facebook pill -->
  <rect x="383" y="428" width="78" height="22" rx="11" fill="rgba(24,119,242,0.15)" stroke="rgba(24,119,242,0.4)" stroke-width="1"/>
  <text x="422" y="443" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="8.5" font-weight="700" fill="#60a5fa">Facebook</text>

  <!-- TikTok pill -->
  <rect x="469" y="428" width="68" height="22" rx="11" fill="rgba(105,201,208,0.12)" stroke="rgba(105,201,208,0.35)" stroke-width="1"/>
  <text x="503" y="443" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="8.5" font-weight="700" fill="#69C9D0">TikTok</text>

  <!-- Twitter/X pill -->
  <rect x="545" y="428" width="56" height="22" rx="11" fill="rgba(29,161,242,0.12)" stroke="rgba(29,161,242,0.35)" stroke-width="1"/>
  <text x="573" y="443" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="8.5" font-weight="700" fill="#1DA1F2">X / Twitter</text>

  <!-- Engagement tag -->
  <rect x="295" y="456" width="130" height="14" rx="5" fill="rgba(255,255,255,0.04)"/>
  <text x="360" y="466" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="7.5" fill="rgba(255,255,255,0.3)">Optimized for engagement &amp; conversions</text>

  <!-- ── PHOTOSHOP BADGE (bottom right) ── -->
  <g filter="url(#softShadow)">
    <rect x="636" y="345" width="134" height="36" rx="10" fill="#001e36"/>
    <rect x="644" y="353" width="20" height="20" rx="4" fill="#31A8FF"/>
    <text x="654" y="366" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="10" font-weight="900" fill="white">Ps</text>
    <text x="700" y="360" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="8.5" font-weight="700" fill="white">Photoshop</text>
    <text x="700" y="373" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="8" fill="#31A8FF">Graphic Design</text>
  </g>
</svg>
