<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f5f0eb"/>
      <stop offset="60%" style="stop-color:#eef3ff"/>
      <stop offset="100%" style="stop-color:#e0f0fa"/>
    </linearGradient>
    <linearGradient id="serverGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#5eead4"/>
      <stop offset="100%" style="stop-color:#0891b2"/>
    </linearGradient>
    <linearGradient id="phpGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#818cf8"/>
      <stop offset="100%" style="stop-color:#6366f1"/>
    </linearGradient>
    <linearGradient id="jsGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fbbf24"/>
      <stop offset="100%" style="stop-color:#f59e0b"/>
    </linearGradient>
    <linearGradient id="dbGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#34d399"/>
      <stop offset="100%" style="stop-color:#059669"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="rgba(0,0,0,0.12)"/>
    </filter>
    <filter id="softShadow">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="rgba(0,0,0,0.08)"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bg)"/>

  <!-- Subtle grid dots -->
  <pattern id="dots" x="0" y="0" width="30" height="30" patternUnits="userSpaceOnUse">
    <circle cx="2" cy="2" r="1" fill="rgba(99,102,241,0.08)"/>
  </pattern>
  <rect width="800" height="450" fill="url(#dots)"/>

  <!-- ── LEFT ACCENT BAR ── -->
  <rect x="28" y="28" width="5" height="90" rx="3" fill="#6366f1"/>

  <!-- ── TITLE ── -->
  <text x="45" y="62" font-family="'Segoe UI',Arial,sans-serif" font-size="22" font-weight="800" fill="#1e1b4b" letter-spacing="1">WEB-MY-CHAT:</text>
  <text x="45" y="90" font-family="'Segoe UI',Arial,sans-serif" font-size="19" font-weight="800" fill="#3730a3" letter-spacing="0.5">REAL-TIME MESSAGING APP</text>

  <!-- ── FEATURES BOX ── -->
  <rect x="28" y="108" width="210" height="70" rx="8" fill="white" fill-opacity="0.75" filter="url(#softShadow)"/>
  <text x="40" y="125" font-family="'Segoe UI',Arial,sans-serif" font-size="10" font-weight="700" fill="#4338ca">Features:</text>
  <text x="40" y="140" font-family="'Segoe UI',Arial,sans-serif" font-size="9.5" fill="#374151">• Instant Messaging  • User Authentication</text>
  <text x="40" y="155" font-family="'Segoe UI',Arial,sans-serif" font-size="9.5" fill="#374151">• Live User Status  • Direct Messages</text>
  <text x="40" y="170" font-family="'Segoe UI',Arial,sans-serif" font-size="9.5" fill="#374151">• Responsive Design  • Session Management</text>

  <!-- ── CHAT MOCKUP (left panel) ── -->
  <g filter="url(#shadow)">
    <!-- Phone frame -->
    <rect x="30" y="200" width="160" height="220" rx="16" fill="#1e1b4b"/>
    <rect x="38" y="212" width="144" height="200" rx="10" fill="#f8fafc"/>
    <!-- Header -->
    <rect x="38" y="212" width="144" height="32" rx="10" fill="#4f46e5"/>
    <circle cx="56" cy="228" r="8" fill="white" fill-opacity="0.3"/>
    <text x="70" y="232" font-family="'Segoe UI',Arial,sans-serif" font-size="9" font-weight="700" fill="white">Web My Chat</text>
    <circle cx="170" cy="228" r="4" fill="#34d399"/>
    <!-- Chat bubbles -->
    <rect x="46" y="252" width="80" height="20" rx="10" fill="#e0e7ff"/>
    <text x="55" y="266" font-family="'Segoe UI',Arial,sans-serif" font-size="8" fill="#3730a3">Hey, how are you?</text>
    <rect x="96" y="278" width="78" height="20" rx="10" fill="#4f46e5"/>
    <text x="104" y="292" font-family="'Segoe UI',Arial,sans-serif" font-size="8" fill="white">I'm great, thanks!</text>
    <rect x="46" y="304" width="60" height="20" rx="10" fill="#e0e7ff"/>
    <text x="55" y="318" font-family="'Segoe UI',Arial,sans-serif" font-size="8" fill="#3730a3">Awesome! 🎉</text>
    <rect x="106" y="330" width="70" height="20" rx="10" fill="#4f46e5"/>
    <text x="114" y="344" font-family="'Segoe UI',Arial,sans-serif" font-size="8" fill="white">Let's catch up!</text>
    <!-- Input bar -->
    <rect x="42" y="358" width="118" height="18" rx="9" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
    <text x="52" y="371" font-family="'Segoe UI',Arial,sans-serif" font-size="7.5" fill="#94a3b8">Type a message...</text>
    <circle cx="152" cy="367" r="7" fill="#4f46e5"/>
  </g>

  <!-- ── CENTER SERVER ── -->
  <g filter="url(#shadow)">
    <rect x="335" y="155" width="130" height="140" rx="12" fill="url(#serverGrad)"/>
    <!-- Server lines -->
    <rect x="350" y="175" width="100" height="14" rx="4" fill="rgba(255,255,255,0.25)"/>
    <rect x="350" y="195" width="100" height="14" rx="4" fill="rgba(255,255,255,0.2)"/>
    <rect x="350" y="215" width="100" height="14" rx="4" fill="rgba(255,255,255,0.15)"/>
    <text x="400" y="253" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="11" font-weight="700" fill="white">SERVER</text>
    <!-- WebSockets badge -->
    <rect x="355" y="262" width="90" height="22" rx="6" fill="rgba(255,255,255,0.2)"/>
    <text x="400" y="277" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="9" font-weight="700" fill="white">WEBSOCKETS</text>
  </g>

  <!-- ── TECH NODES ── -->
  <!-- PHP node -->
  <g filter="url(#softShadow)">
    <rect x="238" y="140" width="80" height="44" rx="10" fill="url(#phpGrad)"/>
    <text x="278" y="158" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="11" font-weight="800" fill="white">PHP</text>
    <text x="278" y="174" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="8" fill="rgba(255,255,255,0.85)">Backend</text>
  </g>

  <!-- JS node -->
  <g filter="url(#softShadow)">
    <rect x="238" y="260" width="80" height="44" rx="10" fill="url(#jsGrad)"/>
    <text x="278" y="278" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="10" font-weight="800" fill="#1c1917">JavaScript</text>
    <text x="278" y="294" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="8" fill="rgba(28,25,23,0.75)">Frontend</text>
  </g>

  <!-- DB / Session node -->
  <g filter="url(#softShadow)">
    <rect x="488" y="260" width="90" height="44" rx="10" fill="url(#dbGrad)"/>
    <text x="533" y="278" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="10" font-weight="800" fill="white">MySQL / PHP</text>
    <text x="533" y="294" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="8" fill="rgba(255,255,255,0.85)">Sessions &amp; DB</text>
  </g>

  <!-- Responsive node -->
  <g filter="url(#softShadow)">
    <rect x="488" y="155" width="90" height="44" rx="10" fill="#f472b6"/>
    <text x="533" y="173" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="10" font-weight="800" fill="white">Responsive</text>
    <text x="533" y="189" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="8" fill="rgba(255,255,255,0.85)">CSS Design</text>
  </g>

  <!-- ── CONNECTOR LINES ── -->
  <!-- PHP → Server -->
  <line x1="318" y1="162" x2="335" y2="200" stroke="#818cf8" stroke-width="2" stroke-dasharray="5,3" opacity="0.7"/>
  <!-- JS → Server -->
  <line x1="318" y1="282" x2="335" y2="250" stroke="#fbbf24" stroke-width="2" stroke-dasharray="5,3" opacity="0.7"/>
  <!-- Server → DB -->
  <line x1="465" y1="250" x2="488" y2="270" stroke="#34d399" stroke-width="2" stroke-dasharray="5,3" opacity="0.7"/>
  <!-- Server → Responsive -->
  <line x1="465" y1="200" x2="488" y2="185" stroke="#f472b6" stroke-width="2" stroke-dasharray="5,3" opacity="0.7"/>
  <!-- Chat mockup → PHP -->
  <line x1="190" y1="260" x2="238" y2="162" stroke="#818cf8" stroke-width="1.5" stroke-dasharray="4,3" opacity="0.5"/>

  <!-- ── RIGHT PANEL: Devices ── -->
  <g filter="url(#softShadow)">
    <!-- Desktop mockup -->
    <rect x="620" y="160" width="140" height="95" rx="6" fill="#1e293b"/>
    <rect x="626" y="166" width="128" height="78" rx="3" fill="#f8fafc"/>
    <rect x="626" y="166" width="128" height="16" rx="3" fill="#334155"/>
    <circle cx="636" cy="174" r="3" fill="#ef4444" opacity="0.8"/>
    <circle cx="645" cy="174" r="3" fill="#fbbf24" opacity="0.8"/>
    <circle cx="654" cy="174" r="3" fill="#22c55e" opacity="0.8"/>
    <rect x="630" y="188" width="55" height="8" rx="3" fill="#e0e7ff"/>
    <rect x="690" y="188" width="58" height="44" rx="4" fill="#4f46e5" opacity="0.15"/>
    <rect x="630" y="200" width="55" height="8" rx="3" fill="#c7d2fe"/>
    <rect x="630" y="212" width="40" height="8" rx="3" fill="#e0e7ff"/>
    <rect x="630" y="224" width="50" height="8" rx="3" fill="#c7d2fe"/>
    <rect x="695" y="192" width="48" height="7" rx="3" fill="#6366f1" opacity="0.4"/>
    <rect x="695" y="203" width="48" height="7" rx="3" fill="#6366f1" opacity="0.3"/>
    <rect x="695" y="214" width="34" height="7" rx="3" fill="#6366f1" opacity="0.2"/>
    <!-- Stand -->
    <rect x="682" y="255" width="16" height="8" rx="2" fill="#475569"/>
    <rect x="670" y="263" width="40" height="4" rx="2" fill="#475569"/>
    <!-- Mobile mockup -->
    <rect x="652" y="285" width="50" height="82" rx="8" fill="#1e293b"/>
    <rect x="657" y="292" width="40" height="68" rx="5" fill="#f8fafc"/>
    <rect x="657" y="292" width="40" height="14" rx="5" fill="#4f46e5"/>
    <rect x="661" y="312" width="25" height="6" rx="3" fill="#e0e7ff"/>
    <rect x="668" y="322" width="25" height="6" rx="3" fill="#4f46e5" opacity="0.5"/>
    <rect x="661" y="333" width="20" height="6" rx="3" fill="#e0e7ff"/>
    <rect x="668" y="343" width="25" height="6" rx="3" fill="#4f46e5" opacity="0.5"/>
  </g>

  <!-- ── GITHUB BADGE ── -->
  <g filter="url(#softShadow)">
    <rect x="618" y="370" width="152" height="36" rx="10" fill="#0f172a"/>
    <!-- GitHub icon simplified -->
    <circle cx="638" cy="388" r="9" fill="white"/>
    <text x="638" y="392" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="10" font-weight="900" fill="#0f172a">G</text>
    <text x="690" y="385" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="9" font-weight="700" fill="white">OPEN-SOURCE</text>
    <text x="690" y="398" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="9" fill="#94a3b8">ON GITHUB</text>
  </g>

  <!-- ── LABEL TAGS ── -->
  <!-- Modern UI/UX label -->
  <g>
    <line x1="578" y1="177" x2="618" y2="195" stroke="#f472b6" stroke-width="1.5" opacity="0.5"/>
    <rect x="530" y="128" width="80" height="22" rx="6" fill="#fdf2f8"/>
    <text x="570" y="143" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="9" font-weight="700" fill="#db2777">Modern UI/UX</text>
  </g>

  <!-- Responsive Design label -->
  <g>
    <line x1="533" y1="304" x2="650" y2="330" stroke="#34d399" stroke-width="1.5" opacity="0.5"/>
    <rect x="480" y="320" width="100" height="22" rx="6" fill="#f0fdf4"/>
    <text x="530" y="335" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="9" font-weight="700" fill="#16a34a">Responsive Design</text>
  </g>

  <!-- Connection dots -->
  <circle cx="335" cy="200" r="5" fill="#5eead4"/>
  <circle cx="335" cy="250" r="5" fill="#5eead4"/>
  <circle cx="465" cy="200" r="5" fill="#5eead4"/>
  <circle cx="465" cy="250" r="5" fill="#5eead4"/>
  <circle cx="318" cy="162" r="4" fill="#818cf8"/>
  <circle cx="318" cy="282" r="4" fill="#fbbf24"/>
  <circle cx="488" cy="270" r="4" fill="#34d399"/>
  <circle cx="488" cy="185" r="4" fill="#f472b6"/>
</svg>
